<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>配合ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout: スマホゲーム風。上に所持品バー、下にタブバー、中身は1列。モフの詳細・交配・大会・結果はすべて下から出るシート */
/* 単一テーマ (牧草地のライト) に意図的に固定 */
:root {
  color-scheme: light;
  --bg: #bfe3cf;
  --bg-dot: #aad6bd;
  --panel: #fffdf6;
  --panel-2: #eef5ec;
  --ink: #22312b;
  --muted: #5b6b63;
  --soft: #d3e2d6;
  --brand: #23805f;
  --brand-bg: #d2efdf;
  --btn: #ffc23d;
  --coin: #f2a900;
  --str: #eb6834;
  --cha: #2a78d6;
  --fer: #1baf7a;
  --rare: #9a6200;
  --rare-bg: #ffefc2;
  --danger: #c93c3c;
  --danger-bg: #fde2df;
  --ok: #23734a;
  --ok-bg: #d8f1e2;
  --tile: #e2efe4;
  --outline: rgba(34, 49, 43, .6);
  --font-logo: "Dela Gothic One", "Hiragino Sans", sans-serif;
  --font: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --r: 14px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: radial-gradient(var(--bg-dot) 1.6px, transparent 1.8px);
  background-size: 22px 22px;
  color: var(--ink);
  font: 500 15px/1.6 var(--font);
  padding-top: 62px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 84px);
}
body.has-pair { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); }
body.locked { overflow: hidden; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
b, strong { font-weight: 800; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* ---- 部品 ---- */
.box { background: var(--panel); border: 2px solid var(--ink); border-radius: var(--r); box-shadow: 0 3px 0 var(--ink); }
.btn { min-height: 44px; padding: 8px 14px; border: 2px solid var(--ink); border-radius: 12px; background: var(--panel); box-shadow: 0 3px 0 var(--ink); font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn.go { background: var(--btn); }
.btn.brand { background: var(--brand); color: #fff; }
.btn.warn { background: var(--danger-bg); color: var(--danger); }
.btn:disabled { background: var(--panel-2); color: var(--muted); border-color: var(--soft); box-shadow: 0 3px 0 var(--soft); cursor: not-allowed; }
.btn.wide { width: 100%; }
.btn .sub { display: block; font-size: 12px; font-weight: 700; opacity: .85; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 800; line-height: 1; padding: 4px 8px; border-radius: 99px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.chip.pa { background: var(--brand); color: #fff; }
.chip.zz { background: #e6e8e4; color: var(--muted); }
.chip.gold { background: var(--rare-bg); color: var(--rare); }
.chip.red { background: var(--danger-bg); color: var(--danger); }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.stars { color: var(--coin); font-size: 12px; letter-spacing: -1px; -webkit-text-stroke: .4px var(--rare); }
.ava { display: block; border-radius: 50%; background: var(--tile); border: 2px solid var(--ink); flex: none; overflow: hidden; }
.ava svg { width: 100%; height: 100%; display: block; }
.ico { width: 18px; height: 18px; flex: none; }
h1, h2, h3 { margin: 0; line-height: 1.3; }
h2 { font-size: 19px; font-weight: 800; }
h3 { font-size: 15px; font-weight: 800; }
p { margin: 0; }

/* ---- 上の所持品バー ---- */
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 20; background: var(--panel); border-bottom: 2px solid var(--ink); padding-top: env(safe-area-inset-top, 0px); }
.top-in { max-width: 1100px; margin: 0 auto; padding-inline: 12px; height: 60px; display: flex; align-items: center; gap: 8px; }
.logo { font: 400 20px var(--font-logo); color: var(--brand); margin-right: 6px; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 10px; border-radius: 99px; background: var(--panel-2); border: 2px solid var(--ink); font-weight: 800; font-size: 15px; white-space: nowrap; }
.pill.low { background: var(--danger-bg); color: var(--danger); }
.pill .feed { font-size: 11px; color: var(--muted); font-weight: 700; }
.pill .c { display: inline-flex; align-items: center; gap: 5px; }
.top .grow { flex: 1; }
.top .next { min-height: 42px; padding: 6px 12px; }
@media (max-width: 520px) {
  .logo { display: none; }
  .top-in { gap: 6px; padding-inline: 10px; }
  .pill { padding: 0 8px; font-size: 14px; }
  .pill { flex-direction: column; justify-content: center; gap: 0; line-height: 1.05; }
  .pill .feed { font-size: 9.5px; }
  .top .next { padding: 6px 10px; font-size: 14px; }
}

/* ---- 下のタブバー ---- */
.nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: var(--panel); border-top: 2px solid var(--ink); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.nav button { position: relative; border: 0; background: none; min-height: 64px; display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 12px; font-weight: 800; color: var(--muted); cursor: pointer; }
.nav button svg { width: 26px; height: 26px; }
.nav button[aria-current="page"] { color: var(--brand); }
.nav button[aria-current="page"]::before { content: ""; position: absolute; inset: 6px 14px; border-radius: 14px; background: var(--brand-bg); z-index: -1; }
.nav .bd { position: absolute; top: 5px; left: 50%; margin-left: 8px; font-size: 10px; line-height: 1; padding: 3px 5px; border-radius: 99px; background: var(--danger); color: #fff; border: 1.5px solid var(--panel); white-space: nowrap; }

/* ---- 画面 ---- */
.view { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 24px; display: grid; gap: 14px; }

/* 所長のひとこと */
.boss { display: flex; gap: 10px; align-items: center; }
.boss .ava { width: 52px; height: 52px; background: #f6f1e4; }
.bubble { position: relative; flex: 1; background: var(--panel); border: 2px solid var(--ink); border-radius: 14px; padding: 8px 12px; font-weight: 700; font-size: 14px; }
.bubble::before { content: ""; position: absolute; left: -8px; top: 50%; margin-top: -6px; border: 6px solid transparent; border-right: 8px solid var(--ink); border-left: 0; }
.bubble .who { display: block; font-size: 11px; color: var(--muted); }

.bar-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.bar-row h2 small { font-size: 14px; color: var(--muted); margin-left: 6px; }
select { min-height: 44px; padding: 6px 10px; border: 2px solid var(--ink); border-radius: 12px; background: var(--panel); font-weight: 700; }

/* モフ一覧 */
.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
@media (max-width: 700px) { .list { grid-template-columns: minmax(0, 1fr); } }
.mofu { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px 12px; text-align: left; cursor: pointer; }
.mofu:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.mofu.sel { background: #f2fbf5; border-color: var(--brand); box-shadow: 0 3px 0 var(--brand); }
.mofu .ava { width: 56px; height: 56px; }
.mofu .head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; min-width: 0; }
.mofu .nm { font-weight: 800; font-size: 16px; }
.mofu .sx { color: var(--muted); font-weight: 800; }
.meters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
.m { display: grid; gap: 2px; min-width: 0; }
.m .top-l { display: flex; justify-content: space-between; gap: 4px; font-size: 11.5px; }
.m .ml { color: var(--muted); font-weight: 700; white-space: nowrap; }
.m .mv { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m .mv.q { color: var(--muted); }
.trk { position: relative; display: block; height: 8px; border-radius: 4px; background: var(--panel-2); border: 1.5px solid var(--soft); overflow: hidden; }
.trk .band { position: absolute; top: 0; bottom: 0; opacity: .35; }
.trk .band.vague { opacity: .2; }
.trk .band.guess { opacity: .12; }
.m .mv.g, .big-meters .v.g { color: var(--muted); font-weight: 700; }
.trk .dot { position: absolute; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; border: 1.5px solid #fff; }
.trk .gen { position: absolute; top: -2px; bottom: -2px; width: 2px; margin-left: -1px; background: var(--ink); }

/* 交配バー */
.pairbar { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 66px); z-index: 19; padding-inline: 12px; pointer-events: none; }
.pairbar .box { pointer-events: auto; max-width: 620px; margin: 0 auto 6px; display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
.pairbar .ava { width: 40px; height: 40px; }
.pairbar .who { font-size: 13px; font-weight: 800; min-width: 0; flex: 1; line-height: 1.3; }
.pairbar .who span { display: block; color: var(--muted); font-size: 11.5px; font-weight: 700; }
.pairbar .x { font-weight: 800; color: var(--muted); }
.slot-empty { width: 40px; height: 40px; border-radius: 50%; border: 2px dashed var(--muted); display: grid; place-items: center; color: var(--muted); font-weight: 800; flex: none; }

/* シート */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(20, 30, 26, .45); }
.sheet { position: fixed; z-index: 31; left: 0; right: 0; bottom: 0; max-height: 90vh; overflow: auto; overscroll-behavior: contain; background: var(--panel); border-top: 2px solid var(--ink); border-radius: 20px 20px 0 0; padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 20px); }
@media (max-width: 759px) { .sheet.tall { min-height: 86vh; } }
@media (min-width: 760px) {
  .sheet.tall { min-height: 80vh; }
  .sheet { left: 50%; right: auto; bottom: auto; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100% - 32px)); max-height: 86vh; border: 2px solid var(--ink); border-radius: 20px; box-shadow: 0 5px 0 var(--ink); padding-bottom: 20px; }
}
.sheet-head { position: sticky; top: 0; z-index: 1; background: var(--panel); display: flex; align-items: center; gap: 8px; padding: 12px 0 10px; border-bottom: 2px solid var(--soft); margin-bottom: 12px; }
.sheet-head .grab { position: absolute; top: 5px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: var(--soft); }
.sheet-head h2 { flex: 1; min-width: 0; }
.iconbtn { width: 44px; height: 44px; flex: none; border: 2px solid var(--ink); border-radius: 12px; background: var(--panel); box-shadow: 0 2px 0 var(--ink); font-weight: 800; font-size: 18px; cursor: pointer; display: grid; place-items: center; }
.iconbtn:disabled { opacity: .35; cursor: not-allowed; }
.sheet-body { display: grid; gap: 14px; }
.who-big { display: flex; gap: 12px; align-items: center; }
.who-big .ava { width: 84px; height: 84px; }
.who-big .t { display: grid; gap: 4px; min-width: 0; }
.who-big .nm { font-size: 21px; font-weight: 800; line-height: 1.2; }
.who-big .o { font-size: 12.5px; color: var(--muted); font-weight: 700; }
.flash { border: 2px solid var(--ink); border-radius: 12px; padding: 10px 12px; font-weight: 800; background: var(--rare-bg); }
.flash.ok { background: var(--ok-bg); }
.flash.bad { background: var(--danger-bg); color: var(--danger); }
.looks { display: flex; flex-wrap: wrap; gap: 5px; }
.looks span { font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--panel-2); }
.looks span.rare { background: var(--rare-bg); color: var(--rare); font-weight: 800; }
.big-meters { display: grid; gap: 8px; }
.big-meters .r { display: grid; grid-template-columns: 4em minmax(60px, 1fr) max-content; gap: 10px; align-items: center; font-size: 13.5px; }
.big-meters .r .v { text-align: right; font-weight: 800; white-space: nowrap; }
.big-meters .trk { height: 12px; border-radius: 6px; }
.big-meters .trk .dot { width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; }
.acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.acts .btn { flex-direction: column; gap: 0; padding: 8px 10px; min-height: 58px; }
.acts .btn .sub { font-size: 11.5px; }
.nextrow { display: flex; gap: 8px; }
.nextrow .btn { flex: 1; }
details { border: 2px solid var(--soft); border-radius: 12px; padding: 0 12px; }
details[open] { padding-bottom: 10px; }
summary { min-height: 44px; display: flex; align-items: center; font-weight: 800; cursor: pointer; }
.rec { display: grid; gap: 2px; font-size: 13px; }
.rec div { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px dashed var(--soft); }
.gtable { width: 100%; border-collapse: collapse; font-size: 13px; }
.gtable td, .gtable th { padding: 6px 4px; border-bottom: 1px dashed var(--soft); text-align: left; vertical-align: top; }
.gtable th { font-size: 11.5px; color: var(--muted); }
.gtable tr.me td { background: var(--brand-bg); font-weight: 800; }
.al { display: inline-flex; gap: 3px; flex-wrap: wrap; }
.al span { font: 800 12px var(--font); padding: 0 6px; border-radius: 6px; background: var(--panel-2); border: 1.5px solid var(--soft); }
.al span.hi { background: var(--brand-bg); border-color: var(--brand); }
.legend { font-size: 12px; color: var(--muted); }
.ped { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.ped .btn { justify-content: flex-start; font-size: 13px; min-height: 44px; }
.ped .btn .l { color: var(--muted); font-size: 11.5px; }

.pair-big { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.pslot { display: grid; justify-items: center; gap: 4px; text-align: center; padding: 10px 6px; border: 2px dashed var(--soft); border-radius: 14px; font-weight: 800; }
.pslot.on { border-style: solid; border-color: var(--ink); }
.pslot .ava { width: 60px; height: 60px; }
.pslot .btn { min-height: 36px; padding: 2px 12px; font-size: 13px; box-shadow: 0 2px 0 var(--ink); }
.cross { font: 400 22px var(--font-logo); color: var(--muted); }
.hist svg { width: 100%; height: auto; display: block; }
.hist .ht { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; }
.stack { display: flex; height: 22px; border-radius: 6px; overflow: hidden; gap: 2px; border: 1.5px solid var(--ink); }
.stack span { display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; min-width: 0; white-space: nowrap; overflow: hidden; }
.prow { display: grid; grid-template-columns: 4em minmax(0, 1fr); gap: 8px; align-items: center; font-size: 13px; font-weight: 700; }
.kv { display: flex; flex-wrap: wrap; gap: 6px; }
.lock { border: 2px dashed var(--soft); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; color: var(--muted); font-weight: 700; }
.pups { display: flex; flex-wrap: wrap; gap: 8px; }
.pup { display: grid; justify-items: center; gap: 2px; font-size: 12px; font-weight: 800; padding: 8px; min-width: 76px; cursor: pointer; }
.pup .ava { width: 48px; height: 48px; }

/* 大会 */
.hall { padding: 14px 16px; display: flex; gap: 12px; align-items: center; background: var(--rare-bg); }
.hall b { font: 400 22px var(--font-logo); color: var(--rare); }
.events { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 12px; }
.ev { padding: 14px; display: grid; gap: 10px; align-content: start; }
.ev .h { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
.ev .d { font-size: 13px; color: var(--muted); font-weight: 700; }
.ladder { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.ladder span { text-align: center; font-size: 11.5px; font-weight: 800; padding: 3px 0; border-radius: 8px; background: var(--panel-2); color: var(--muted); }
.ladder span.on { background: var(--brand); color: #fff; }
.ladder span.cur { background: var(--btn); color: var(--ink); outline: 2px solid var(--ink); }
.facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; font-weight: 700; color: var(--muted); }
.facts b { color: var(--ink); }
.row-pick { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--soft); }
.row-pick .ava { width: 48px; height: 48px; }
.row-pick .t { min-width: 0; }
.row-pick .t b { display: block; }
.row-pick .t > span { font-size: 13px; color: var(--muted); font-weight: 700; margin-right: 6px; }
.row-pick.off { opacity: .55; }
.result-big { text-align: center; display: grid; gap: 4px; padding: 6px 0; }
.result-big .p { font: 400 34px var(--font-logo); }
.result-big .p.win { color: var(--rare); }

/* ガチャ */
.banner { padding: 18px; display: grid; gap: 6px; background: var(--brand); color: #fff; overflow: hidden; position: relative; }
.banner .k { font-size: 12px; font-weight: 800; opacity: .9; }
.banner .t { font: 400 clamp(24px, 6vw, 32px)/1.15 var(--font-logo); }
.banner .left { font-size: 13px; font-weight: 800; opacity: .9; }
.banner::after { content: ""; position: absolute; right: -30px; bottom: -50px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.1); }
.pulls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pulls .btn { flex-direction: column; gap: 0; min-height: 64px; padding: 6px; }
.why { font-size: 12.5px; font-weight: 700; color: var(--danger); }
.caps { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.cap { display: grid; justify-items: center; gap: 3px; padding: 10px 6px; text-align: center; font-size: 13px; font-weight: 800; cursor: pointer; }
.cap .ava { width: 60px; height: 60px; }
.cap.sp { background: var(--rare-bg); }
.cap .s { font-size: 11.5px; color: var(--muted); font-weight: 700; }
.cap.sp .s { color: var(--rare); font-weight: 800; }
.rates { width: 100%; border-collapse: collapse; font-size: 13px; }
.rates td { padding: 5px 4px; border-bottom: 1px dashed var(--soft); }
.rates td:nth-child(2) { text-align: right; font-weight: 800; }

/* 研究所 */
.labs { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.res { padding: 12px 14px; display: grid; gap: 8px; align-content: start; }
.res.done { background: var(--panel-2); box-shadow: none; border-color: var(--soft); }
.res .h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.res .w { font-size: 13.5px; font-weight: 700; color: var(--muted); }
.res .req { font-size: 12.5px; font-weight: 800; color: var(--danger); }

.diary { display: grid; gap: 4px; font-size: 13px; max-height: 260px; overflow: auto; }
.diary div { display: grid; grid-template-columns: 3.6em 1fr; gap: 6px; }
.diary .d { color: var(--muted); font-weight: 800; }
.day-list { display: grid; gap: 8px; }
.day-list .li { display: flex; gap: 10px; align-items: center; font-weight: 700; }
.day-list .li .ava { width: 40px; height: 40px; }
.day-title { font: 400 30px var(--font-logo); text-align: center; padding: 6px 0 2px; }

/* ガチャの機械とカプセル */
.machine { width: 190px; margin: 0 auto; }
.machine svg { width: 100%; height: auto; display: block; }
.machine .handle, .machine .globe { transform-box: fill-box; transform-origin: center; }
.say { text-align: center; font-weight: 800; color: var(--muted); }
.tray { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
.capsule { border: 0; background: none; cursor: pointer; display: grid; justify-items: center; align-content: center; gap: 6px; min-height: 150px; padding: 6px; font-weight: 800; font-size: 12.5px; color: var(--muted); }
.shell { position: relative; width: 66px; height: 66px; border-radius: 50%; border: 2.5px solid var(--ink); box-shadow: 0 3px 0 var(--ink); background: linear-gradient(180deg, var(--cap) 0 50%, #fffdf6 50% 100%); overflow: hidden; }
.shell::after { content: ""; position: absolute; left: 0; right: 0; top: calc(50% - 1.5px); height: 3px; background: var(--ink); }
.shell::before { content: ""; position: absolute; left: 12px; top: 8px; width: 14px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.6); }

    s.tries++; s.hits += born;
    d.births.push({ day: G.day, n: born });
    for (let k = 0; k < born; k++) ids.push(addInd({ g: childGenome(s.g, d.g, R), sex: R() < 0.5 ? "M" : "F", star: 0, sire: s.id, dam: d.id, gen: Math.max(s.gen, d.gen) + 1, born: G.day }).id);
    note(`${s.name}×${d.name}: ${born}匹うまれた`);
    litters.push({ s: s.id, d: d.id, ids });
  }
  G.pairs = [];
  return litters;
}

/* ---------- 大会 ---------- */
const TOURS = {
  race: { name: "モフレース", short: "レース", desc: "強さで勝負", trait: "str", offset: 0, tool: "watch" },
  contest: { name: "美モフコンテスト", short: "コンテスト", desc: "魅力で勝負", trait: "cha", offset: 0, tool: "score" },
  show: { name: "品評会", short: "品評会", desc: "3つの能力の平均で勝負", trait: null, offset: -6, tool: "stats" },
};
const TIERS = [
  { name: "初級", s: "初", mean: 40, prize: 80 },
  { name: "中級", s: "中", mean: 55, prize: 180 },
  { name: "上級", s: "上", mean: 68, prize: 400 },
  { name: "王者", s: "王", mean: 80, prize: 1000 },
];
const PLACE_PAY = [1, 0.3, 0.15], ENTRY_PAY = 10;
function enterTour(type, id) {
  const ind = get(id), T = TOURS[type], tier = TIERS[G.tiers[type]];
  if (!ind || restWhy(ind) || G.entered[type] === G.day) return;
  ind.acted = G.day; G.entered[type] = G.day;
  const score = T.trait ? measure(ind, T.trait, 6, T.short + "大会", U(T.tool))
    : clamp(Math.round((cur(ind, "str") + cur(ind, "cha") + cur(ind, "fer")) / 3 + gauss(R) * 5), 0, 100);
  const rows = [{ name: ind.name, score, me: true, id: ind.id }];
  for (let i = 0; i < 7; i++) {
    const sc = clamp(Math.round(tier.mean + T.offset + gauss(R) * 7), 0, 100);
    const g = gachaGenome(RARITY[Math.min(4, G.tiers[type] + 1)], BANNERS[0], R);
    rows.push({ name: "野良の" + makeName(R), score: sc, me: false, g, sex: R() < .5 ? "M" : "F", look: { str: sc, cha: sc, fer: 55 } });
  }
  rows.forEach((r, i) => (r.lane = (i * 5 + 3) % 8));
  rows.sort((a, b) => b.score - a.score || (a.me ? -1 : b.me ? 1 : 0));
  const place = rows.findIndex(r => r.me) + 1;
  const prize = place <= 3 ? Math.round(tierPrize(type) * PLACE_PAY[place - 1]) : ENTRY_PAY;
  G.coins += prize;
  let up = "";
  if (place === 1) {
    ind.wins++;
    if (G.tiers[type] < 3) { G.tiers[type]++; up = `${TIERS[G.tiers[type]].name}に昇格！`; }
    else if (!G.cleared[type]) { G.cleared[type] = true; up = "王者の称号を獲得！"; }
    else { G.defense = G.defense || {}; G.defense[type] = (G.defense[type] || 0) + 1; up = "防衛成功！"; }
    if (!G.hallDay && Object.values(G.cleared).every(Boolean)) { G.hallDay = G.day; up += " 殿堂入り！！"; }
  }
  G.tourRes[type] = { day: G.day, tier: tier.name, rows, place, prize, shown: U(T.tool), who: ind.id, up };
  note(`${T.name}${tier.name}: ${ind.name} ${place}位 +${prize}${up ? " " + up : ""}`);
}

/* 王者を制覇したあとは防衛戦。防衛するたびに賞金が減っていく (1000 → 500 → 333 …、下限150) */
function tierPrize(type) {
  const base = TIERS[G.tiers[type]].prize;
  if (!G.cleared[type]) return base;
  return Math.max(150, Math.round(base / (2 + ((G.defense || {})[type] || 0))));
}

/* ---------- 別れ ---------- */
const LETTERS = ["山の上はすずしいよ。みんな元気？", "旅先でもまだ走ってるよ。", "海を見た。しょっぱかった。", "おいしい草を見つけたから、少し送るね。", "大会、見に行ったよ。がんばってたね。", "星がたくさん見える村にいるよ。", "雨やどりした木の下で、昔の話をしたよ。", "旅の仲間ができた。そっちのみんなに似てる。", "朝の霧がきれいな谷についた。", "今日はよく眠れた。また手紙を書くね。"];
function letterFor(ind) {
  const own = [];
  if (ind.wins) own.push(`${ind.wins}回の優勝、旅先でもつい自慢しちゃう。`);
  if (isMega(ind.g)) own.push("旅先で岩を持ち上げたら、村じゅうで大さわぎになった。");
  if (ind.sex === "F" && ind.births.some(b => b.n)) own.push("子どもたちは元気？ ちゃんと食べてるかな。");
  if (ind.sex === "M" && ind.hits) own.push(`${ind.hits}匹の子どもたちによろしく。`);
  if (coat(ind.g).key === "white") own.push("雪の中だと、みんなにぜんぜん見つけてもらえない。");
  const recent = G.log.slice(0, 60).map(l => l.text).join("\n");
  const fresh = list => list.filter(t => !recent.includes(t));
  const pool = fresh(own).length && R() < .7 ? fresh(own) : fresh(LETTERS);
  return pool[Math.floor(R() * pool.length)] || LETTERS[0];
}
const LETTER_GIFT = 60;
function depart(ind, voluntary) {
  G.stock = G.stock.filter(x => x !== ind.id);
  if (G.sel.F === ind.id) G.sel.F = null;
  if (G.sel.M === ind.id && !G.bank.includes(ind.id)) G.sel.M = null;
  ind.goneDay = G.day; ind.goneAge = ageOf(ind); ind.sentOff = voluntary;
  G.album.unshift(ind.id);
  G.letters.push({ id: ind.id, day: G.day + 2 + Math.floor(R() * 3), gift: voluntary });
  note(`${ind.name}が旅立った (生後${ind.goneAge}日${ind.wins ? `・優勝${ind.wins}回` : ""})`);
}
function sendOff(id) {
  const ind = get(id);
  if (!ind || !inStock(id) || !["old1", "old2"].includes(stage(ind))) return;
  depart(ind, true);
  ui.sheet = null;
  toast(`${ind.name}を送り出した。元気でね`);
}
function bankSire(id) {
  const ind = get(id);
  if (!ind || ind.sex !== "M" || !U("bank") || G.bank.includes(id) || G.coins < COST.bank) return;
  G.coins -= COST.bank; G.bank.push(id);
  note(`${ind.name}の遺伝子を保存`);
  ui.flash = { cls: "ok", text: "遺伝子を保存した。旅立ったあとも父にできる" };
}

/* ---------- 1日の終わり ---------- */
const upkeep = () => G.stock.reduce((s, id) => s + (isAdult(get(id)) ? UPKEEP_ADULT : UPKEEP_BABY), 0);
function endDay() {
  const cost = upkeep(), oldBanner = bannerOf(G.day);
  const before = new Map(G.stock.map(id => [id, stage(get(id))]));
  G.coins -= cost;
  G.day++;
  const litters = breedNight();
  const gotTicket = G.tickets < MAX_TICKETS;
  if (gotTicket) G.tickets++;
  G.tourRes = {}; G.pulls = [];
  const gone = G.stock.map(get).filter(i => ageOf(i) >= i.L);
  gone.forEach(i => depart(i, false));
  const aging = G.stock.map(get).filter(i => stage(i) !== before.get(i.id) && ["old1", "old2"].includes(stage(i))).map(i => ({ id: i.id, st: stage(i) }));
  const due = G.letters.filter(l => l.day <= G.day);
  G.letters = G.letters.filter(l => l.day > G.day);
  const letters = due.map(l => ({ id: l.id, text: letterFor(get(l.id)), gift: l.gift !== false }));
  for (const l of letters) { if (l.gift) G.coins += LETTER_GIFT; note(`${get(l.id).name}から手紙「${l.text}」${l.gift ? ` (+${LETTER_GIFT})` : ""}`); }
  const grown = G.stock.map(get).filter(i => ageOf(i) === ADULT_AGE);
  const info = { cost, gotTicket, grown: grown.map(i => i.id), gone: gone.map(i => i.id), aging, letters, banner: bannerOf(G.day) !== oldBanner ? bannerOf(G.day).name : null };
  note(`${G.day}日目の朝 (餌代 −${cost})`);
  grown.forEach(i => { const sp = specials(i); note(sp.length ? `${i.name}が大人に…${sp.join("、")}！` : `${i.name}が大人になった`); });
  info.born = litters.reduce((a, l) => a + l.ids.length, 0);
  const day = { kind: "day", info }, over = Math.max(0, G.stock.length - G.cap);
  const keep = over ? { kind: "keep", ids: litters.flatMap(l => l.ids), over, pick: [], next: day } : null;
  ui.sheet = litters.length ? { kind: "birth", litters, next: keep || day } : day;
}

/* ---------- ガチャ ---------- */
function pullWhy(n, pay) {
  if (room() < n) return room() ? `空きが${room()}匹分しかない` : "飼育場が満員";
  if (pay === "ticket") return G.tickets < 1 ? "明日また1枚" : "";
  const c = n === 5 ? PULL5_COST : PULL_COST;
  return G.coins < c ? `あと${c - G.coins}コイン` : "";
}
function pull(n, pay) {
  if (pullWhy(n, pay)) return;
  if (pay === "ticket") G.tickets--; else G.coins -= n === 5 ? PULL5_COST : PULL_COST;
  const banner = bannerOf(G.day), ids = [];
  for (let i = 0; i < n; i++) {
    const rar = rollRarity(R);
    ids.push(addInd({ g: gachaGenome(rar, banner, R), sex: R() < 0.5 ? "M" : "F", star: rar.star, sire: null, dam: null, gen: 0, born: G.day - 2 - Math.floor(R() * 3) }).id);
  }
  G.pulls.push(...ids);
  ids.map(get).forEach(i => note(`ガチャ: ${i.name} ★${i.star}${specials(i).length ? "・" + specials(i)[0] : ""}`));
  ui.sheet = { kind: "gacha", ids, phase: calm() ? "tray" : "turn", opened: [], just: [] };
}

function buy(id) {
  const r = RESEARCH.find(x => x.id === id);
  if (!r || U(id) || !reqOk(r) || G.coins < r.price) return;
  G.coins -= r.price; G.unlocks[id] = G.day;
  note(`研究所: ${r.name}を導入`);
  toast(`${r.name}を導入した！`);
}
function sell(id) {
  const ind = get(id);
  G.stock = G.stock.filter(x => x !== id);
  if (G.sel.M === id) G.sel.M = null;
  if (G.sel.F === id) G.sel.F = null;
  G.coins += SELL_PRICE;
  note(`${ind.name}を里親に出した (+${SELL_PRICE})`);
  toast(`${ind.name}を里親に出した +${SELL_PRICE}`);
  ui.sheet = null;
}

/* ---------- 所長のひとこと ---------- */
function bossLine() {
  const all = G.stock.map(get), adults = all.filter(isAdult), ready = all.filter(canAct);
  const measured = all.some(i => TRAITS.some(t => i.meas[t].length));
  if (G.coins < upkeep() * 2) return "コインが心細い。大会で稼ぐか、何匹か里親に出して餌代を減らそう。";
  if (!measured) return "まずは誰かをタップして「走らせる」。見た目だけじゃ実力はわからんぞ。";
  const old = all.find(i => stage(i) === "old2");
  if (old) return `${old.name}がだいぶ年をとった。旅立つ前に${old.sex === "M" && U("bank") && !G.bank.includes(old.id) ? "遺伝子を保存するか、" : ""}送り出してやろう。`;
  if (G.sel.M != null && G.sel.F == null) return "父は決まった。次は母 ♀ をタップして「母にする」。";
  if (G.sel.F != null && G.sel.M == null) return "母は決まった。次は父 ♂ をタップして「父にする」。";
  if (adults.length && !ready.length) return "今日はみんなお休み。右上の「次の日へ」で明日にしよう。";
  if (!Object.keys(G.unlocks).length && G.coins >= 250) return "研究所で道具を買うと、能力が数字で見えるようになる。";
  if (!G.pairs.length && adults.some(i => i.sex === "M") && adults.some(i => i.sex === "F") && measured) return "今夜のペアがまだ決まってない。父と母を選んで「今夜のペアにする」。子は朝までに生まれる。";
  if (G.tickets > 0 && room() > 0) return "ガチャチケットが残ってる。新しい子を迎えてみよう。";
  if (Object.keys(TOURS).some(k => G.entered[k] !== G.day) && ready.length) return "大会はまだ空いてる。実力がわかってきた子を出してみよう。";
  return "動ける子は1日1回、実験か大会に。交配は行動を使わず、夜にペアで。";
}

/* ---------- 描画ヘルパ ---------- */
const $ = sel => document.querySelector(sel);
/* SVG の属性値に var() を書くと効かないブラウザがあるので style にまとめ直す */
function svgVars(html) {
  return html.replace(/<[^>]+>/g, tag => {
    const decl = [];
    const t = tag.replace(/\s(fill|stroke|font-family)="(var\([^"]+\))"/g, (_, k, v) => { decl.push(`${k}:${v}`); return ""; });
    return decl.length ? t.replace(/^<([\w:-]+)/, `<$1 style="${decl.join(";")}"`) : tag;
  });
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sexMark = s => (s === "M" ? "♂" : "♀");
const starStr = n => (n ? `<span class="stars" aria-label="レア度${n}">${"★".repeat(n)}</span>` : "");
const ava = (ind, size) => `<span class="ava" style="width:${size}px;height:${size}px">${avatar(ind)}</span>`;
const fmt = n => n.toLocaleString("ja-JP");

function track(ind, t) {
  const i = traitInfo(ind, t), gv = ind.dna >= 2 ? baseValues(ind.g)[t] : null;
  let s = "";
  if (i && i.kind === "est") { const lo = clamp(i.mean - i.ci, 0, 100), hi = clamp(i.mean + i.ci, 0, 100); s += `<span class="band" style="left:${lo}%;width:${hi - lo}%;background:var(--${t})"></span><span class="dot" style="left:${clamp(i.mean, 0, 100)}%;background:var(--${t})"></span>`; }
  else if (i && i.kind === "last") s += `<span class="dot" style="left:${i.v}%;background:var(--${t})"></span>`;
  else if (i && i.kind === "guess") s += `<span class="band guess" style="left:${i.lo}%;width:${i.hi - i.lo}%;background:var(--${t})"></span>`;
  else if (i) { const [a, b] = BIN5[i.bin]; s += `<span class="band vague" style="left:${a}%;width:${b - a}%;background:var(--${t})"></span>`; }
  if (gv != null) s += `<span class="gen" style="left:${clamp(gv, 0, 100)}%"></span>`;
  return `<span class="trk">${s}</span>`;
}
function badges(ind) {
  const b = [];
  if (G.sel.M === ind.id) b.push(`<span class="chip pa">父</span>`);
  if (G.sel.F === ind.id) b.push(`<span class="chip pa">母</span>`);
  if (!isAdult(ind)) b.push(`<span class="chip">幼体 あと${ADULT_AGE - (G.day - ind.born)}日</span>`);
  if (inStock(ind.id) && ind.acted === G.day) b.push(`<span class="chip zz">zzz 休み</span>`);
  const st = stage(ind);
  if (st === "old1") b.push(`<span class="chip zz">白髪</span>`);
  if (st === "old2") b.push(`<span class="chip red">そろそろ</span>`);
  if (isAdult(ind) && isSpecial(ind)) b.push(`<span class="chip gold">特異体質</span>`);
  if (!has(ind.g, "D")) b.push(`<span class="chip red">病気</span>`);
  if (ind.wins) b.push(`<span class="chip gold">優勝${ind.wins}</span>`);
  return b.join("");
}

/* ---------- 飼育場 ---------- */
const expandPrice = () => 400;
function farmOrder() {
  const ids = G.stock.slice();
  const val = (i, t) => { const x = traitInfo(i, t); return x ? x.key : -1; };

}
function renderFarm() {

  h += `<div class="list">${ids.map(id => {

    </button>`;
  }).join("") || `<p class="bubble">誰もいない…ガチャで迎えよう。</p>`}</div>`;

  save();
}
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2200); }
function arm(key) { ui.confirm = key; clearTimeout(ui.confirmT); ui.confirmT = setTimeout(() => { if (ui.confirm === key) { ui.confirm = null; render(); } }, 6000); }

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const act = el.dataset.act, id = el.dataset.id != null && act !== "buy" ? +el.dataset.id : null;
  const keep = ui.confirm;
  ui.confirm = null;
  switch (act) {
    case "tab": ui.tab = el.dataset.tab; ui.sheet = null; window.scrollTo(0, 0); try { localStorage.setItem(STORE_KEY + "-tab", ui.tab); } catch (err) {} break;
    case "open": ui.flash = null; ui.sheet = { kind: "mofu", id }; break;
    case "open-birth": ui.flash = null; ui.sheet = { kind: "mofu", id, back: ui.sheet }; break;
    case "close": if (ui.sheet && ui.sheet.kind === "keep") return; ui.sheet = ui.sheet && ui.sheet.back || (ui.sheet && ["birth"].includes(ui.sheet.kind) ? ui.sheet.next : null); ui.flash = null; break;
    case "exp": doExp(id, el.dataset.kind); break;
    case "gtest": geneTest(id, +el.dataset.lv); break;
    case "pair": { const ind = get(id); G.sel[ind.sex] = G.sel[ind.sex] === id ? null : id; ui.flash = null;
      if (G.sel.M != null && G.sel.F != null) { ui.sheet = { kind: "mate" }; }
      else toast(G.sel[ind.sex] === id ? `${ind.name}を${ind.sex === "M" ? "父" : "母"}の候補にした。次は${ind.sex === "M" ? "母 ♀" : "父 ♂"}を選ぼう` : "候補から外した");
      break; }
    case "unpair": G.sel[el.dataset.sex] = null; ui.flash = null; break;
    case "open-mate": ui.flash = null; ui.sheet = { kind: "mate" }; break;
    case "sell": if (keep !== "sell:" + id) { arm("sell:" + id); break; } sell(id); break;
    case "send": if (keep !== "send:" + id) { arm("send:" + id); break; } sendOff(id); break;
    case "bank": bankSire(id); break;
    case "buy": if (keep !== "buy:" + el.dataset.id) { arm("buy:" + el.dataset.id); break; } buy(el.dataset.id); break;
    case "reset": if (keep !== "reset") { arm("reset"); break; } newGame(Date.now() >>> 0); ui.tab = "farm"; ui.sheet = null; toast("新しい牧場をはじめた"); break;
    case "endday": endDay(); break;
    case "entry": ui.sheet = { kind: "entry", type: el.dataset.type }; break;
    case "enter": enterTour(el.dataset.type, id); ui.sheet = { kind: "result", type: el.dataset.type, phase: calm() ? "done" : el.dataset.type === "race" ? "race" : "announce", shown: 0 }; break;
    case "result": ui.sheet = { kind: "result", type: el.dataset.type, phase: "done" }; break;
    case "skip": if (ui.sheet) ui.sheet.phase = "done"; break;
    case "keep-pick": { const k = ui.sheet; if (!k || k.kind !== "keep") break; if (k.pick.includes(id)) k.pick = k.pick.filter(x => x !== id); else if (k.pick.length < k.over) k.pick.push(id); break; }
    case "keep-done": { const k = ui.sheet; if (!k || k.pick.length !== k.over) break;
      for (const x of k.pick) { const p = get(x); G.stock = G.stock.filter(y => y !== x); G.coins += FOSTER_BABY; note(`${p.name}を里親に出した (+${FOSTER_BABY})`); }
      toast(`${k.ids.length - k.over}匹を迎えた。${k.over}匹は里親のもとへ`);
      ui.sheet = k.next || null; break; }
    case "next": ui.sheet = ui.sheet && ui.sheet.next || null; break;
    case "pair-reg": registerPair(); break;
    case "pair-del": G.pairs.splice(+el.dataset.i, 1); ui.flash = null; break;
    case "cap": { const g = ui.sheet; if (g && !g.opened.includes(id)) { g.opened.push(id); g.just = [id]; } break; }
    case "cap-all": { const g = ui.sheet; if (g) { g.just = g.ids.filter(x => !g.opened.includes(x)); g.opened = g.ids.slice(); } break; }
    case "pull": pull(+el.dataset.n, el.dataset.pay); break;
    case "expand": { const p = expandPrice(); if (G.cap >= MAX_CAP || G.coins < p) break; if (keep !== "expand") { arm("expand"); break; } G.coins -= p; G.cap = Math.min(MAX_CAP, G.cap + 4); note(`飼育場を${G.cap}匹分に (−${p})`); toast(`飼育場が${G.cap}匹分に広がった`); break; }
    default: return;
  }
  render();
});
document.addEventListener("change", e => { if (e.target.id === "sort") { G.sort = e.target.value; render(); } });
document.addEventListener("keydown", e => {
  if (!ui.sheet) return;
  if (e.key === "Escape" && !["keep", "birth"].includes(ui.sheet.kind)) { ui.sheet = ui.sheet.back || null; ui.flash = null; render(); }
});

/* ---------- 起動 ---------- */
function start(data) {
  let ok = data && data.game ? restore(data.game) : false;
  if (!ok) { try { ok = restore(JSON.parse(localStorage.getItem(STORE_KEY))); } catch (e) { ok = false; } }
  if (!ok) newGame(20261006);
  try { const t = localStorage.getItem(STORE_KEY + "-tab"); if (["farm", "tour", "gacha", "lab"].includes(t)) ui.tab = t; } catch (e) {}
  render();
}
window.claude?.hot?.snapshot?.(() => ({ game: { ...G, reg: [...G.reg.values()] } }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
