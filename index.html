<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>配合ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout: スマホゲーム風。上に所持品バー、下にタブバー、中身は1列。モフの詳細・交配・大会・結果はすべて下から出るシート */
/* 単一テーマ (牧草地のライト) に意図的に固定 */
:root {
  color-scheme: light;
  --bg: #bfe3cf;
  --bg-dot: #aad6bd;
  --panel: #fffdf6;
  --panel-2: #eef5ec;
  --ink: #22312b;
  --muted: #5b6b63;
  --soft: #d3e2d6;
  --brand: #23805f;
  --brand-bg: #d2efdf;
  --btn: #ffc23d;
  --coin: #f2a900;
  --str: #eb6834;
  --cha: #2a78d6;
  --fer: #1baf7a;
  --rare: #9a6200;
  --rare-bg: #ffefc2;
  --danger: #c93c3c;
  --danger-bg: #fde2df;
  --ok: #23734a;
  --ok-bg: #d8f1e2;
  --tile: #e2efe4;
  --outline: rgba(34, 49, 43, .6);
  --font-logo: "Dela Gothic One", "Hiragino Sans", sans-serif;
  --font: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --r: 14px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: radial-gradient(var(--bg-dot) 1.6px, transparent 1.8px);
  background-size: 22px 22px;
  color: var(--ink);
  font: 500 15px/1.6 var(--font);
  padding-top: 62px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 84px);
}
body.has-pair { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); }
body.locked { overflow: hidden; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
b, strong { font-weight: 800; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* ---- 部品 ---- */
.box { background: var(--panel); border: 2px solid var(--ink); border-radius: var(--r); box-shadow: 0 3px 0 var(--ink); }
.btn { min-height: 44px; padding: 8px 14px; border: 2px solid var(--ink); border-radius: 12px; background: var(--panel); box-shadow: 0 3px 0 var(--ink); font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn.go { background: var(--btn); }
.btn.brand { background: var(--brand); color: #fff; }
.btn.warn { background: var(--danger-bg); color: var(--danger); }
.btn:disabled { background: var(--panel-2); color: var(--muted); border-color: var(--soft); box-shadow: 0 3px 0 var(--soft); cursor: not-allowed; }
.btn.wide { width: 100%; }
.btn .sub { display: block; font-size: 12px; font-weight: 700; opacity: .85; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 800; line-height: 1; padding: 4px 8px; border-radius: 99px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.chip.pa { background: var(--brand); color: #fff; }
.chip.zz { background: #e6e8e4; color: var(--muted); }
.chip.gold { background: var(--rare-bg); color: var(--rare); }
.chip.red { background: var(--danger-bg); color: var(--danger); }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.stars { color: var(--coin); font-size: 12px; letter-spacing: -1px; -webkit-text-stroke: .4px var(--rare); }
.ava { display: block; border-radius: 50%; background: var(--tile); border: 2px solid var(--ink); flex: none; overflow: hidden; }
.ava svg { width: 100%; height: 100%; display: block; }
.ico { width: 18px; height: 18px; flex: none; }
h1, h2, h3 { margin: 0; line-height: 1.3; }
h2 { font-size: 19px; font-weight: 800; }
h3 { font-size: 15px; font-weight: 800; }
p { margin: 0; }

/* ---- 上の所持品バー ---- */
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 20; background: var(--panel); border-bottom: 2px solid var(--ink); padding-top: env(safe-area-inset-top, 0px); }
.top-in { max-width: 1100px; margin: 0 auto; padding-inline: 12px; height: 60px; display: flex; align-items: center; gap: 8px; }
.logo { font: 400 20px var(--font-logo); color: var(--brand); margin-right: 6px; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 10px; border-radius: 99px; background: var(--panel-2); border: 2px solid var(--ink); font-weight: 800; font-size: 15px; white-space: nowrap; }
.pill.low { background: var(--danger-bg); color: var(--danger); }
.pill .feed { font-size: 11px; color: var(--muted); font-weight: 700; }
.pill .c { display: inline-flex; align-items: center; gap: 5px; }
.top .grow { flex: 1; }
.top .next { min-height: 42px; padding: 6px 12px; }
@media (max-width: 520px) {
  .logo { display: none; }
  .top-in { gap: 6px; padding-inline: 10px; }
  .pill { padding: 0 8px; font-size: 14px; }
  .pill { flex-direction: column; justify-content: center; gap: 0; line-height: 1.05; }
  .pill .feed { font-size: 9.5px; }
  .top .next { padding: 6px 10px; font-size: 14px; }
}

/* ---- 下のタブバー ---- */
.nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: var(--panel); border-top: 2px solid var(--ink); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.nav button { position: relative; border: 0; background: none; min-height: 64px; display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 12px; font-weight: 800; color: var(--muted); cursor: pointer; }
.nav button svg { width: 26px; height: 26px; }
.nav button[aria-current="page"] { color: var(--brand); }
.nav button[aria-current="page"]::before { content: ""; position: absolute; inset: 6px 14px; border-radius: 14px; background: var(--brand-bg); z-index: -1; }
.nav .bd { position: absolute; top: 5px; left: 50%; margin-left: 8px; font-size: 10px; line-height: 1; padding: 3px 5px; border-radius: 99px; background: var(--danger); color: #fff; border: 1.5px solid var(--panel); white-space: nowrap; }

/* ---- 画面 ---- */
.view { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 24px; display: grid; gap: 14px; }

/* 所長のひとこと */
.boss { display: flex; gap: 10px; align-items: center; }
.boss .ava { width: 52px; height: 52px; background: #f6f1e4; }
.bubble { position: relative; flex: 1; background: var(--panel); border: 2px solid var(--ink); border-radius: 14px; padding: 8px 12px; font-weight: 700; font-size: 14px; }
.bubble::before { content: ""; position: absolute; left: -8px; top: 50%; margin-top: -6px; border: 6px solid transparent; border-right: 8px solid var(--ink); border-left: 0; }
.bubble .who { display: block; font-size: 11px; color: var(--muted); }

.bar-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.bar-row h2 small { font-size: 14px; color: var(--muted); margin-left: 6px; }
select { min-height: 44px; padding: 6px 10px; border: 2px solid var(--ink); border-radius: 12px; background: var(--panel); font-weight: 700; }

/* モフ一覧 */
.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
@media (max-width: 700px) { .list { grid-template-columns: minmax(0, 1fr); } }
.mofu { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px 12px; text-align: left; cursor: pointer; }
.mofu:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.mofu.sel { background: #f2fbf5; border-color: var(--brand); box-shadow: 0 3px 0 var(--brand); }
.mofu .ava { width: 56px; height: 56px; }
.mofu .head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; min-width: 0; }
.mofu .nm { font-weight: 800; font-size: 16px; }
.mofu .sx { color: var(--muted); font-weight: 800; }
.meters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
.m { display: grid; gap: 2px; min-width: 0; }
.m .top-l { display: flex; justify-content: space-between; gap: 4px; font-size: 11.5px; }
.m .ml { color: var(--muted); font-weight: 700; }
.m .mv { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m .mv.q { color: var(--muted); }
.trk { position: relative; display: block; height: 8px; border-radius: 4px; background: var(--panel-2); border: 1.5px solid var(--soft); overflow: hidden; }
.trk .band { position: absolute; top: 0; bottom: 0; opacity: .35; }
.trk .band.vague { opacity: .2; }
.trk .dot { position: absolute; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; border: 1.5px solid #fff; }
.trk .gen { position: absolute; top: -2px; bottom: -2px; width: 2px; margin-left: -1px; background: var(--ink); }

/* 交配バー */
.pairbar { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 66px); z-index: 19; padding-inline: 12px; pointer-events: none; }
.pairbar .box { pointer-events: auto; max-width: 620px; margin: 0 auto 6px; display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
.pairbar .ava { width: 40px; height: 40px; }
.pairbar .who { font-size: 13px; font-weight: 800; min-width: 0; flex: 1; line-height: 1.3; }
.pairbar .who span { display: block; color: var(--muted); font-size: 11.5px; font-weight: 700; }
.pairbar .x { font-weight: 800; color: var(--muted); }
.slot-empty { width: 40px; height: 40px; border-radius: 50%; border: 2px dashed var(--muted); display: grid; place-items: center; color: var(--muted); font-weight: 800; flex: none; }

/* シート */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(20, 30, 26, .45); }
.sheet { position: fixed; z-index: 31; left: 0; right: 0; bottom: 0; max-height: 90vh; overflow: auto; overscroll-behavior: contain; background: var(--panel); border-top: 2px solid var(--ink); border-radius: 20px 20px 0 0; padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 20px); }
@media (max-width: 759px) { .sheet.tall { min-height: 86vh; } }
@media (min-width: 760px) {
  .sheet.tall { min-height: 80vh; }
  .sheet { left: 50%; right: auto; bottom: auto; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100% - 32px)); max-height: 86vh; border: 2px solid var(--ink); border-radius: 20px; box-shadow: 0 5px 0 var(--ink); padding-bottom: 20px; }
}
.sheet-head { position: sticky; top: 0; z-index: 1; background: var(--panel); display: flex; align-items: center; gap: 8px; padding: 12px 0 10px; border-bottom: 2px solid var(--soft); margin-bottom: 12px; }
.sheet-head .grab { position: absolute; top: 5px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: var(--soft); }
.sheet-head h2 { flex: 1; min-width: 0; }
.iconbtn { width: 44px; height: 44px; flex: none; border: 2px solid var(--ink); border-radius: 12px; background: var(--panel); box-shadow: 0 2px 0 var(--ink); font-weight: 800; font-size: 18px; cursor: pointer; display: grid; place-items: center; }
.iconbtn:disabled { opacity: .35; cursor: not-allowed; }
.sheet-body { display: grid; gap: 14px; }
.who-big { display: flex; gap: 12px; align-items: center; }
.who-big .ava { width: 84px; height: 84px; }
.who-big .t { display: grid; gap: 4px; min-width: 0; }
.who-big .nm { font-size: 21px; font-weight: 800; line-height: 1.2; }
.who-big .o { font-size: 12.5px; color: var(--muted); font-weight: 700; }
.flash { border: 2px solid var(--ink); border-radius: 12px; padding: 10px 12px; font-weight: 800; background: var(--rare-bg); }
.flash.ok { background: var(--ok-bg); }
.flash.bad { background: var(--danger-bg); color: var(--danger); }
.looks { display: flex; flex-wrap: wrap; gap: 5px; }
.looks span { font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--panel-2); }
.looks span.rare { background: var(--rare-bg); color: var(--rare); font-weight: 800; }
.big-meters { display: grid; gap: 8px; }
.big-meters .r { display: grid; grid-template-columns: 4em minmax(0, 1fr) 6.4em; gap: 10px; align-items: center; font-size: 13.5px; }
.big-meters .r .v { text-align: right; font-weight: 800; white-space: nowrap; }
.big-meters .trk { height: 12px; border-radius: 6px; }
.big-meters .trk .dot { width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; }
.acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.acts .btn { flex-direction: column; gap: 0; padding: 8px 10px; min-height: 58px; }
.acts .btn .sub { font-size: 11.5px; }
.nextrow { display: flex; gap: 8px; }
.nextrow .btn { flex: 1; }
details { border: 2px solid var(--soft); border-radius: 12px; padding: 0 12px; }
details[open] { padding-bottom: 10px; }
summary { min-height: 44px; display: flex; align-items: center; font-weight: 800; cursor: pointer; }
.rec { display: grid; gap: 2px; font-size: 13px; }
.rec div { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px dashed var(--soft); }
.gtable { width: 100%; border-collapse: collapse; font-size: 13px; }
.gtable td, .gtable th { padding: 6px 4px; border-bottom: 1px dashed var(--soft); text-align: left; vertical-align: top; }
.gtable th { font-size: 11.5px; color: var(--muted); }
.gtable tr.me td { background: var(--brand-bg); font-weight: 800; }
.al { display: inline-flex; gap: 3px; flex-wrap: wrap; }
.al span { font: 800 12px var(--font); padding: 0 6px; border-radius: 6px; background: var(--panel-2); border: 1.5px solid var(--soft); }
.al span.hi { background: var(--brand-bg); border-color: var(--brand); }
.legend { font-size: 12px; color: var(--muted); }
.ped { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.ped .btn { justify-content: flex-start; font-size: 13px; min-height: 44px; }
.ped .btn .l { color: var(--muted); font-size: 11.5px; }

.pair-big { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.pslot { display: grid; justify-items: center; gap: 4px; text-align: center; padding: 10px 6px; border: 2px dashed var(--soft); border-radius: 14px; font-weight: 800; }
.pslot.on { border-style: solid; border-color: var(--ink); }
.pslot .ava { width: 60px; height: 60px; }
.pslot .btn { min-height: 36px; padding: 2px 12px; font-size: 13px; box-shadow: 0 2px 0 var(--ink); }
.cross { font: 400 22px var(--font-logo); color: var(--muted); }
.hist svg { width: 100%; height: auto; display: block; }
.hist .ht { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; }
.stack { display: flex; height: 22px; border-radius: 6px; overflow: hidden; gap: 2px; border: 1.5px solid var(--ink); }
.stack span { display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; min-width: 0; white-space: nowrap; overflow: hidden; }
.prow { display: grid; grid-template-columns: 4em minmax(0, 1fr); gap: 8px; align-items: center; font-size: 13px; font-weight: 700; }
.kv { display: flex; flex-wrap: wrap; gap: 6px; }
.lock { border: 2px dashed var(--soft); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; color: var(--muted); font-weight: 700; }
.pups { display: flex; flex-wrap: wrap; gap: 8px; }
.pup { display: grid; justify-items: center; gap: 2px; font-size: 12px; font-weight: 800; padding: 8px; min-width: 76px; cursor: pointer; }
.pup .ava { width: 48px; height: 48px; }

/* 大会 */
.hall { padding: 14px 16px; display: flex; gap: 12px; align-items: center; background: var(--rare-bg); }
.hall b { font: 400 22px var(--font-logo); color: var(--rare); }
.events { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 12px; }
.ev { padding: 14px; display: grid; gap: 10px; align-content: start; }
.ev .h { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
.ev .d { font-size: 13px; color: var(--muted); font-weight: 700; }
.ladder { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.ladder span { text-align: center; font-size: 11.5px; font-weight: 800; padding: 3px 0; border-radius: 8px; background: var(--panel-2); color: var(--muted); }
.ladder span.on { background: var(--brand); color: #fff; }
.ladder span.cur { background: var(--btn); color: var(--ink); outline: 2px solid var(--ink); }
.facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; font-weight: 700; color: var(--muted); }
.facts b { color: var(--ink); }
.row-pick { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--soft); }
.row-pick .ava { width: 48px; height: 48px; }
.row-pick .t { min-width: 0; }
.row-pick .t b { display: block; }
.row-pick .t > span { font-size: 13px; color: var(--muted); font-weight: 700; margin-right: 6px; }
.row-pick.off { opacity: .55; }
.result-big { text-align: center; display: grid; gap: 4px; padding: 6px 0; }
.result-big .p { font: 400 34px var(--font-logo); }
.result-big .p.win { color: var(--rare); }

/* ガチャ */
.banner { padding: 18px; display: grid; gap: 6px; background: var(--brand); color: #fff; overflow: hidden; position: relative; }
.banner .k { font-size: 12px; font-weight: 800; opacity: .9; }
.banner .t { font: 400 clamp(24px, 6vw, 32px)/1.15 var(--font-logo); }
.banner .left { font-size: 13px; font-weight: 800; opacity: .9; }
.banner::after { content: ""; position: absolute; right: -30px; bottom: -50px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.1); }
.pulls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pulls .btn { flex-direction: column; gap: 0; min-height: 64px; padding: 6px; }
.why { font-size: 12.5px; font-weight: 700; color: var(--danger); }
.caps { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.cap { display: grid; justify-items: center; gap: 3px; padding: 10px 6px; text-align: center; font-size: 13px; font-weight: 800; cursor: pointer; }
.cap .ava { width: 60px; height: 60px; }
.cap.sp { background: var(--rare-bg); }
.cap .s { font-size: 11.5px; color: var(--muted); font-weight: 700; }
.cap.sp .s { color: var(--rare); font-weight: 800; }
.rates { width: 100%; border-collapse: collapse; font-size: 13px; }
.rates td { padding: 5px 4px; border-bottom: 1px dashed var(--soft); }
.rates td:nth-child(2) { text-align: right; font-weight: 800; }

/* 研究所 */
.labs { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.res { padding: 12px 14px; display: grid; gap: 8px; align-content: start; }
.res.done { background: var(--panel-2); box-shadow: none; border-color: var(--soft); }
.res .h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.res .w { font-size: 13.5px; font-weight: 700; color: var(--muted); }
.res .req { font-size: 12.5px; font-weight: 800; color: var(--danger); }

.diary { display: grid; gap: 4px; font-size: 13px; max-height: 260px; overflow: auto; }
.diary div { display: grid; grid-template-columns: 3.6em 1fr; gap: 6px; }
.diary .d { color: var(--muted); font-weight: 800; }
.day-list { display: grid; gap: 8px; }
.day-list .li { display: flex; gap: 10px; align-items: center; font-weight: 700; }
.day-list .li .ava { width: 40px; height: 40px; }
.day-title { font: 400 30px var(--font-logo); text-align: center; padding: 6px 0 2px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 80px); z-index: 40; background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 14px; font-size: 14px; font-weight: 800; max-width: calc(100% - 32px); text-align: center; }
body.has-pair .toast { bottom: calc(env(safe-area-inset-bottom, 0px) + 146px); }
body.locked .toast { bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); }
.footer { display: flex; justify-content: center; padding-top: 8px; }
.footer .btn { font-size: 13px; min-height: 40px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .22s ease-out both; }
  @media (min-width: 760px) { .sheet { animation: fade .18s ease-out both; } }
  .cap, .pup.new { animation: pop .45s cubic-bezier(.2, 1.5, .4, 1) both; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { transform: scale(.5) rotate(-8deg); opacity: 0; } }
}
</style>
</head>
<body>
<header class="top"><div class="top-in" id="top"></div></header>
<main id="main"></main>
<div class="pairbar" id="pairbar" hidden></div>

<script>
(() => {
"use strict";

/* ---------- 乱数 ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const gauss = R => { let u = 0; while (!u) u = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * R()); };
function poisson(lam, R) { const L = Math.exp(-lam); let k = 0, p = 1; do { k++; p *= R(); } while (p > L); return k - 1; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mcR = mulberry32(99);
let R = mulberry32(20261006);

/* ---------- 遺伝子座 ---------- */
const TRAITS = ["str", "cha", "fer"];
const TNAME = { str: "強さ", cha: "魅力", fer: "生殖力" };
const ADD = { str: 4, cha: 4, fer: 3 };
const LOCI = [];
for (const t of TRAITS) for (let i = 1; i <= ADD[t]; i++) LOCI.push({ id: t + i, trait: t, kind: "add" });
/* f = 大文字側 (1) の頻度。x は超筋肉 (ミオスタチン欠損型)、Q は多産型 (ブールーラ型) */
[
  { id: "M", up: "M", lo: "m", f: 0.2, dna: "筋肉" },
  { id: "X", up: "X", lo: "x", f: 0.9, dna: "超筋肉" },
  { id: "Q", up: "Q", lo: "q", f: 0.03, dna: "多産" },
  { id: "D", up: "D", lo: "d", f: 0.8, dna: "健康" },
  { id: "C", up: "C", lo: "c", f: 0.68, dna: "色素" },
  { id: "B", up: "B", lo: "b", f: 0.55, dna: "黒毛" },
  { id: "P", up: "P", lo: "p", f: 0.4, dna: "斑紋" },
].forEach(m => LOCI.push({ ...m, kind: "mend" }));
const IDX = Object.fromEntries(LOCI.map((l, i) => [l.id, i]));
const TLOCI = Object.fromEntries(TRAITS.map(t => [t, LOCI.map((l, i) => (l.trait === t ? i : -1)).filter(i => i >= 0)]));
const MU = 0.005, SIGMA = 6, LOOK_NOISE = 8;

const has = (g, id) => g[IDX[id]][0] | g[IDX[id]][1];
const dose = (g, id) => g[IDX[id]][0] + g[IDX[id]][1];
const isMega = g => !has(g, "X");
const qDose = g => dose(g, "Q");
function baseValues(g) {
  const cnt = t => TLOCI[t].reduce((s, i) => s + g[i][0] + g[i][1], 0);
  const M = has(g, "M"), sick = !has(g, "D"), mega = isMega(g), q = qDose(g);
  return {
    str: 10 + cnt("str") / 8 * 75 + (M ? 15 : 0) + (mega ? 30 : 0) - (q === 2 ? 8 : 0) - (sick ? 25 : 0),
    cha: 10 + cnt("cha") / 8 * 80 - (sick ? 15 : 0),
    fer: 10 + cnt("fer") / 6 * 80 - (M ? 15 : 0) - (mega ? 20 : 0) + [0, 18, 32][q] - (sick ? 30 : 0),
  };
}
function pheno(g, r) {
  const b = baseValues(g), o = {};
  for (const t of TRAITS) o[t] = clamp(Math.round(b[t] + gauss(r) * SIGMA), 0, 100);
  return o;
}
function gamete(pair, r) { let a = pair[r() < 0.5 ? 0 : 1]; if (r() < MU) a ^= 1; return a; }
const childGenome = (s, d, r) => LOCI.map((_, i) => [gamete(s[i], r), gamete(d[i], r)]);

function coat(g) {
  if (!has(g, "C")) return { key: "white", name: "白", spots: 0 };
  const spots = dose(g, "P");
  return has(g, "B") ? { key: "black", name: "黒", spots } : { key: "brown", name: "茶", spots };
}
const SPOTNAME = ["無地", "小斑", "大斑"];
const coatLabel = g => { const c = coat(g); return c.key === "white" ? "白" : c.name + "・" + SPOTNAME[c.spots]; };

/* ---------- ガチャ ---------- */
const RARITY = [
  { star: 1, p: 0.50, f: 0.28 },
  { star: 2, p: 0.32, f: 0.40 },
  { star: 3, p: 0.13, f: 0.52 },
  { star: 4, p: 0.04, f: 0.65 },
  { star: 5, p: 0.01, f: 0.78 },
];
const BANNERS = [
  { name: "いつものガチャ", desc: "ピックアップなし", mod: {} },
  { name: "筋肉フェス", desc: "筋肉質な子が出やすい。まれにムキムキも", mod: { M: 0.6, X: 0.7 } },
  { name: "キラキラ魅力祭", desc: "かわいい子が出やすい", mod: { cha: 0.15 } },
  { name: "多産の春", desc: "子だくさんの家系が出やすい", mod: { fer: 0.15, Q: 0.15 } },
  { name: "まっしろ祭", desc: "白い子が出やすい", mod: { C: 0.3 } },
  { name: "まだら模様フェア", desc: "まだら模様の子が出やすい", mod: { P: 0.75 } },
];
const BANNER_DAYS = 4;
const bannerOf = day => BANNERS[Math.floor((day - 1) / BANNER_DAYS) % BANNERS.length];
const PULL_COST = 100, PULL5_COST = 450, MAX_TICKETS = 3;
function gachaGenome(rar, banner, r) {
  return LOCI.map(l => {
    let f;
    if (l.kind === "add") f = rar.f + (banner.mod[l.trait] || 0);
    else if (l.id === "D") f = 0.74 + rar.star * 0.03;
    else f = banner.mod[l.id] ?? l.f;
    return [r() < f ? 1 : 0, r() < f ? 1 : 0];
  });
}
function rollRarity(r) { let x = r(); for (const k of RARITY) { if ((x -= k.p) < 0) return k; } return RARITY[0]; }

/* ---------- 研究 ---------- */
const RESEARCH = [

  { id: "score", name: "審査員の採点表", price: 250, what: "写真審査・コンテストの結果が点数で出る" },
  { id: "vet", name: "動物病院と提携", price: 300, what: "健康診断ができる。生殖力が点数で出る" },
  { id: "eye", name: "観察眼の修行", price: 200, what: "見た目の印象が細かくなる (3段階→5段階)" },
  { id: "pedigree", name: "血統書", price: 200, what: "祖父母までの血統と近親度がわかる" },
  { id: "stats", name: "統計ノート", price: 400, req: ["watch", "score", "vet"], reqText: "点数が出る道具をどれか1つ", what: "測った点数から実力を推定 (±幅つき)" },
  { id: "kit", name: "DNA検査キット", price: 600, what: "毛色・体質の遺伝子を調べられる (1匹80)" },
  { id: "genome", name: "ゲノム解析装置", price: 1500, req: ["kit"], reqText: "DNA検査キット", what: "能力の遺伝子まで全部調べられる (1匹150)" },
  { id: "sim", name: "交配シミュレータ", price: 1000, req: ["kit"], reqText: "DNA検査キット", what: "検査済みの親なら、子の確率が出る" },
];
const U = k => !!(G.unlocks && G.unlocks[k]);
const reqOk = r => !r.req || r.req.some(U);

/* ---------- 名前 ---------- */
const SYL = ["ポ", "ム", "モ", "チ", "ル", "ナ", "キ", "ピ", "ヤ", "ココ", "ラ", "ミ", "タ", "ハ", "ニ", "ク", "リ", "ソ", "フ", "ノ", "マ", "ロ", "ペ", "サ"];
const TAIL = ["", "", "", "ン", "ー", "ル", "ッチ", "マル", "ゾウ", "スケ"];
const makeName = r => SYL[Math.floor(r() * SYL.length)] + SYL[Math.floor(r() * SYL.length)] + TAIL[Math.floor(r() * TAIL.length)];

/* ---------- 印象のことば ---------- */
const bin5 = v => (v < 30 ? 0 : v < 45 ? 1 : v < 60 ? 2 : v < 75 ? 3 : 4);
const BIN5 = [[0, 30], [30, 45], [45, 60], [60, 75], [75, 100]];
const bin3 = v => (v < 40 ? 0 : v < 68 ? 1 : 2);
const WORD = {
  str: ["鈍足", "遅め", "ふつう", "速い", "俊足"],
  cha: ["不評", "いまいち", "ふつう", "好評", "大人気"],
  fer: ["低い", "低め", "ふつう", "高め", "高い"],
};
const SENT = {
  str: ["かなり遅かった…", "ちょっと遅め", "ふつうの走り", "速い！", "とても速い！！"],
  cha: ["かなり不評…", "いまいちの反応", "ふつうの反応", "好評！", "大好評！！"],
};
const LOOK5 = {
  str: ["ほっそり", "やや細め", "ふつうの体格", "がっしり", "かなりがっしり"],
  cha: ["ぼんやり顔", "やや地味な顔", "ふつうの顔", "かわいい顔", "とびきりかわいい"],
  fer: ["毛がパサパサ", "毛ツヤいまいち", "毛ツヤふつう", "毛ツヤ良好", "毛ツヤつやつや"],
};
const LOOK3 = { str: [0, 2, 3], cha: [1, 2, 3], fer: [0, 2, 4] };

/* ---------- 見た目 ---------- */
const ADULT_AGE = 2;
const isAdult = ind => G.day - ind.born >= ADULT_AGE;
function looks(ind) {
  const adult = isAdult(ind), lk = ind.look;
  return { adult, body: adult ? bin3(lk.str) : 1, eyes: adult ? bin3(lk.cha) : 1, gloss: adult ? bin3(lk.fer) : 0,
    muscle: adult && !!has(ind.g, "M"), mega: adult && isMega(ind.g), q: adult ? qDose(ind.g) : 0, sick: !has(ind.g, "D") };
}
const lookWord = (ind, t) => (U("eye") ? LOOK5[t][bin5(ind.look[t])] : LOOK5[t][LOOK3[t][bin3(ind.look[t])]]);
function specials(ind) {
  const L = looks(ind), out = [];
  if (L.mega) out.push("めっちゃムキムキ");
  if (L.q) out.push(ind.sex === "M" ? (L.q === 2 ? "睾丸がとんでもなくデカい" : "睾丸がめちゃくちゃデカい") : (L.q === 2 ? "お腹がとんでもなくふっくら" : "お腹まわりがやけにふっくら"));
  return out;
}
function looksText(ind) {
  const L = looks(ind), out = [{ t: coatLabel(ind.g) }];
  if (!L.adult) out.push({ t: "体つきはまだわからない" });
  else {
    for (const t of TRAITS) out.push({ t: lookWord(ind, t) });
    if (L.muscle && !L.mega) out.push({ t: "筋肉質" });
    specials(ind).forEach(s => out.push({ t: s, rare: true }));
  }
  if (L.sick) out.push({ t: "元気がない" });
  return out;
}
const COAT_FILL = { black: "#2f2a27", brown: "#9b5a2d", white: "#f5f2ec" };
function avatar(ind) {
  const L = looks(ind), c = coat(ind.g), fill = COAT_FILL[c.key];
  const rx = L.mega ? 23 : [13, 17, 21][L.body], eyeR = [1.9, 2.8, 3.8][L.eyes];
  const pupil = c.key === "white" ? "#c0392b" : "#141414", line = c.key === "black" ? "#e9e2d6" : "#141414";
  const ol = `stroke="var(--outline)" stroke-width="1.2"`;
  let s = `<svg viewBox="0 0 64 64" aria-hidden="true"><g${L.adult ? "" : ` transform="translate(32 40) scale(.74) translate(-32 -36)"`}>`;
  s += `<ellipse cx="21" cy="21" rx="5" ry="8" fill="${fill}" ${ol}/><ellipse cx="43" cy="21" rx="5" ry="8" fill="${fill}" ${ol}/>`;
  if (L.mega) {
    for (const sx of [-1, 1]) s += `<ellipse cx="${32 + sx * 17}" cy="29" rx="8" ry="6.5" fill="${fill}" ${ol}/><ellipse cx="${32 + sx * 24}" cy="42" rx="7.5" ry="9" fill="${fill}" ${ol}/>`;
  } else if (L.muscle) {
    for (const sx of [-1, 1]) s += `<ellipse cx="${32 + sx * (rx + 1)}" cy="42" rx="4.5" ry="5.5" fill="${fill}" ${ol}/>`;
  }
  s += `<ellipse cx="32" cy="38" rx="${rx}" ry="17" fill="${fill}" ${ol}/>`;
  if (L.mega) s += `<path d="M24 47 q8 4 16 0 M26 42 q6 2.5 12 0" fill="none" stroke="${line}" stroke-width="1" opacity=".5" stroke-linecap="round"/>`;
  if (c.spots) {
    const sp = c.key === "black" ? "#e9e2d6" : "#4a2a14";
    const pts = c.spots === 2 ? [[24, 46, 4.5], [40, 44, 3.5], [36, 28, 3], [27, 27, 2.4], [32, 51, 2.6]] : [[40, 45, 3.6], [25, 47, 2.6]];
    let h = ind.id || 1;
    pts.forEach(([x, y, r]) => { h = (h * 9301 + 49297) % 233280; s += `<circle cx="${x + (h % 5) - 2}" cy="${y}" r="${r}" fill="${sp}" opacity=".9"/>`; });
  }
  const shine = c.key === "white" ? "#9fb6cc" : "#ffffff";
  if (L.gloss >= 1) s += `<path d="M${32 - rx * .72} 33 q3 -8 10 -11" fill="none" stroke="${shine}" stroke-width="2" stroke-linecap="round" opacity=".75"/>`;
  if (L.gloss >= 2) s += `<path d="M${32 - rx * .8} 40 q2 -5 6 -7" fill="none" stroke="${shine}" stroke-width="1.6" stroke-linecap="round" opacity=".65"/>`;
  if (L.eyes >= 1) { const o = L.eyes === 2 ? .8 : .4; s += `<ellipse cx="22.5" cy="41" rx="3.4" ry="2" fill="#ff7a9a" opacity="${o}"/><ellipse cx="41.5" cy="41" rx="3.4" ry="2" fill="#ff7a9a" opacity="${o}"/>`; }
  for (const x of [26, 38]) {
    s += `<circle cx="${x}" cy="35" r="${eyeR + 1.1}" fill="#ffffff"/><circle cx="${x}" cy="35.4" r="${eyeR}" fill="${pupil}"/>`;
    if (L.eyes === 2) s += `<circle cx="${x + eyeR * .35}" cy="${34.2 - eyeR * .2}" r="${(eyeR * .35).toFixed(2)}" fill="#ffffff"/>`;
  }
  if (L.muscle || L.mega) s += `<path d="M21.5 29 l7 2 M42.5 29 l-7 2" stroke="${line}" stroke-width="${L.mega ? 2.4 : 1.7}" stroke-linecap="round"/>`;
  s += `<path d="M29.5 42 q2.5 ${L.sick ? -1.5 : 2.6} 5 0" fill="none" stroke="${line}" stroke-width="1.3" stroke-linecap="round"/>`;
  if (L.sick) s += `<g transform="rotate(-25 40 25)"><rect x="33" y="22.5" width="14" height="5" rx="1.5" fill="#f3e3c3" stroke="#b49a6a" stroke-width=".8"/><path d="M38 23.5v3 M42 23.5v3" stroke="#b49a6a" stroke-width=".7"/></g>`;
  return svgVars(s + `</g></svg>`);
}
/* 所長 (白衣にメガネのモフ) */
const BOSS_SVG = `<svg viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="21" cy="21" rx="5" ry="8" fill="#d9c7a7" stroke="#22312b" stroke-width="1.2"/><ellipse cx="43" cy="21" rx="5" ry="8" fill="#d9c7a7" stroke="#22312b" stroke-width="1.2"/><ellipse cx="32" cy="38" rx="18" ry="17" fill="#d9c7a7" stroke="#22312b" stroke-width="1.2"/><path d="M15 44 q17 16 34 0 v12 h-34z" fill="#ffffff" stroke="#22312b" stroke-width="1.2"/><path d="M32 47 v9" stroke="#22312b" stroke-width="1"/><circle cx="26" cy="35" r="5" fill="#fff" stroke="#22312b" stroke-width="1.6"/><circle cx="38" cy="35" r="5" fill="#fff" stroke="#22312b" stroke-width="1.6"/><path d="M31 35 h2" stroke="#22312b" stroke-width="1.6"/><circle cx="26" cy="35.5" r="2" fill="#141414"/><circle cx="38" cy="35.5" r="2" fill="#141414"/><path d="M28.5 43 q3.5 2.4 7 0" fill="none" stroke="#141414" stroke-width="1.3" stroke-linecap="round"/></svg>`;
const ICON = {
  farm: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7v9H3z"/><path d="M9.5 20v-5h5v5"/></svg>`,
  tour: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 13v4M8 20h8"/></svg>`,
  gacha: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M4 12h16"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>`,
  lab: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/><path d="M7.5 15h9"/></svg>`,
  coin: `<svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="#f2a900" stroke="#22312b" stroke-width="2"/><path d="M10 6v8" stroke="#22312b" stroke-width="2" stroke-linecap="round"/></svg>`,
  ticket: `<svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M2 6h16v2.5a1.5 1.5 0 0 0 0 3V14H2v-2.5a1.5 1.5 0 0 0 0-3z" fill="#ff8fa3" stroke="#22312b" stroke-width="1.8" stroke-linejoin="round"/></svg>`,
};

/* ---------- 状態 ---------- */
const STORE_KEY = "haigo-lab-v3";
const START_CAP = 12, MAX_CAP = 40, UPKEEP_ADULT = 3, UPKEEP_BABY = 1;
const COST = { health: 40, kit: 80, genome: 150 };
const SELL_PRICE = 40;
let G;
const kinMemo = new Map();
const ui = { tab: "farm", sheet: null, flash: null, confirm: null, confirmT: null };

function newGame(seed) {
  R = mulberry32(seed);
  kinMemo.clear();
  G = { day: 1, coins: 400, tickets: 1, cap: START_CAP, reg: new Map(), stock: [], nextId: 1, sel: { M: null, F: null }, sort: "new",
    tiers: { race: 0, contest: 0, show: 0 }, cleared: { race: false, contest: false, show: false }, entered: {}, hallDay: null,
    unlocks: {}, log: [], tourRes: {}, pulls: [] };
  const b = BANNERS[0];
  [[2, "M"], [1, "F"], [1, "M"], [2, "F"]].forEach(([star, sex]) => {
    addInd({ g: gachaGenome(RARITY[star - 1], b, R), sex, star, sire: null, dam: null, gen: 0, born: -99 });
  });
  note("牧場を開いた");
}
function addInd({ g, sex, star, sire, dam, gen, born }) {
  const ph = pheno(g, R);
  const look = Object.fromEntries(TRAITS.map(t => [t, ph[t] + gauss(R) * LOOK_NOISE]));
  const ind = { id: G.nextId++, name: makeName(R), g, sex, star: star || 0, sire, dam, gen, born, ph, look,
    meas: { str: [], cha: [], fer: [] }, dna: 0, acted: null, wins: 0, births: [], tries: 0, hits: 0 };
  G.reg.set(ind.id, ind);
  G.stock.push(ind.id);
  return ind;
}
const get = id => G.reg.get(id);
const inStock = id => G.stock.includes(id);
const room = () => G.cap - G.stock.length;
const canAct = ind => inStock(ind.id) && isAdult(ind) && ind.acted !== G.day;
const isSpecial = ind => isMega(ind.g) || qDose(ind.g) > 0;
function note(text) { G.log.unshift({ day: G.day, text }); if (G.log.length > 80) G.log.length = 80; }

function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify({ ...G, reg: [...G.reg.values()] })); } catch (e) { /* 保存できない環境 */ } }
function restore(d) {
  if (!d || !Array.isArray(d.reg) || !Array.isArray(d.stock) || typeof d.day !== "number") return false;
  kinMemo.clear();
  G = { ...d, unlocks: d.unlocks || {}, tourRes: d.tourRes || {}, pulls: d.pulls || [], reg: new Map(d.reg.map(r => [r.id, r])) };
  for (const r of G.reg.values()) { r.births = r.births || []; r.tries = r.tries || 0; r.hits = r.hits || 0; }
  R = mulberry32((Date.now() ^ (d.day * 7919)) >>> 0);
  return true;
}

/* 近縁係数 (Malécot) と近交係数 */
function kin(a, b) {
  if (a == null || b == null) return 0;
  if (a === b) return (1 + inbreeding(a)) / 2;
  if (a < b) [a, b] = [b, a];
  const key = a + "|" + b;
  if (kinMemo.has(key)) return kinMemo.get(key);
  const A = get(a);
  const v = !A || A.sire == null ? 0 : (kin(A.sire, b) + kin(A.dam, b)) / 2;
  kinMemo.set(key, v);
  return v;
}
function inbreeding(id) { const r = get(id); return r && r.sire != null ? kin(r.sire, r.dam) : 0; }
function fChip(F) {
  if (F >= 0.2) return `<span class="chip red">近親度 ${(F * 100).toFixed(1)}%・かなり濃い</span>`;
  if (F >= 0.06) return `<span class="chip gold">近親度 ${(F * 100).toFixed(1)}%・やや濃い</span>`;
  return `<span class="chip ok">近親度 ${(F * 100).toFixed(1)}%</span>`;
}

/* ---------- 測定と、そこからわかること ---------- */
function measure(ind, t, sigma, src, num) {
  const v = clamp(Math.round(ind.ph[t] + gauss(R) * sigma), 0, 100);
  ind.meas[t].push({ v, s: sigma, src, day: G.day, num });
  return v;
}
/* 統計ノートがあれば推定値±幅、点数の記録があれば前回の点数、印象しかなければ印象の平均 */
function traitInfo(ind, t) {
  const nums = ind.meas[t].filter(m => m.num), words = ind.meas[t].filter(m => !m.num);
  if (U("stats") && nums.length) {
    let w = 0, s = 0;
    for (const m of nums) { const wi = 1 / (m.s * m.s); w += wi; s += m.v * wi; }
    return { kind: "est", mean: s / w, ci: 1.96 * Math.sqrt(1 / w), key: s / w };
  }
  if (nums.length) { const v = nums[nums.length - 1].v; return { kind: "last", v, key: v }; }
  if (words.length) { const b = Math.round(words.reduce((a, m) => a + bin5(m.v), 0) / words.length); return { kind: "word", bin: b, key: (BIN5[b][0] + BIN5[b][1]) / 2 }; }
  return null;
}
function infoText(i, t) {
  if (!i) return "？";
  if (i.kind === "est") return `${Math.round(i.mean)}±${Math.round(i.ci)}`;
  if (i.kind === "last") return String(i.v);
  return WORD[t][i.bin] + "?";
}
/* 品評会用: わかっている能力だけで平均。何もわからなければ -1 */
function showKey(ind) {
  const ks = TRAITS.map(t => traitInfo(ind, t)).filter(Boolean).map(i => i.key);
  return ks.length ? ks.reduce((a, b) => a + b, 0) / ks.length : -1;
}

/* ---------- 行動 ---------- */
const EXPS = {
  race: { name: "走らせる", trait: "str", sigma: 10, cost: 0, hint: "強さの手がかり", verb: "かけっこ", tool: "watch" },
  photo: { name: "写真審査", trait: "cha", sigma: 10, cost: 0, hint: "魅力の手がかり", verb: "写真審査", tool: "score" },
  health: { name: "健康診断", trait: "fer", sigma: 8, cost: COST.health, hint: "生殖力を測る", verb: "健康診断", tool: "vet", needs: "vet" },
};
function restWhy(ind) {
  if (!inStock(ind.id)) return "もういない";
  if (!isAdult(ind)) return `幼体・あと${ADULT_AGE - (G.day - ind.born)}日`;
  if (ind.acted === G.day) return "今日はもう休み";
  return "";
}
function expWhy(ind, e) {
  const r = restWhy(ind);
  if (r) return r;
  if (e.needs && !U(e.needs)) return "研究所で動物病院と提携";
  if (G.coins < e.cost) return `コイン不足 (あと${e.cost - G.coins})`;
  return "";
}
function doExp(id, kind) {
  const ind = get(id), e = EXPS[kind];
  if (expWhy(ind, e)) return;
  G.coins -= e.cost;
  ind.acted = G.day;
  const num = U(e.tool), v = measure(ind, e.trait, e.sigma, e.verb, num);
  const first = num && ind.meas[e.trait].filter(m => m.num).length === 1;
  const msg = (num ? `${e.verb}: ${TNAME[e.trait]} ${v}点` : `${e.verb}: ${SENT[e.trait][bin5(v)]}`) + (first || !num && ind.meas[e.trait].length === 1 ? "　(測るたびにぶれる。何回か見てみよう)" : "");
  note(`${ind.name}の${msg}`);
  ui.flash = { cls: "", text: msg };
}
function geneTest(id, level) {
  const ind = get(id), cost = level === 2 ? COST.genome : COST.kit;
  if (ind.dna >= level || G.coins < cost || !U(level === 2 ? "genome" : "kit")) return;
  G.coins -= cost; ind.dna = level;
  const found = [];
  if (dose(ind.g, "D") === 1) found.push("病気 d を隠し持っていた");
  if (dose(ind.g, "X") === 1) found.push("ムキムキの x を隠し持っていた");
  if (qDose(ind.g) && !isAdult(ind)) found.push("多産の Q を持っている");
  note(`${ind.name}の${level === 2 ? "ゲノム解析" : "DNA検査"}${found.length ? ": " + found.join("、") : ""}`);
  ui.flash = { cls: found.length ? "" : "ok", text: found.length ? `判明！ ${found.join("、")}` : "遺伝子がわかった。下の「遺伝子」を開こう" };
}

let predCache = { key: "", val: null };
function predict(s, d) {
  const key = `${s.id}-${d.id}`;
  if (predCache.key === key) return predCache.val;
  const N = 2000, bins = 20, hist = {}, vals = {};
  TRAITS.forEach(t => { hist[t] = new Array(bins).fill(0); vals[t] = []; });
  for (let k = 0; k < N; k++) {
    const ph = pheno(childGenome(s.g, d.g, mcR), mcR);
    for (const t of TRAITS) { hist[t][Math.min(bins - 1, Math.floor(ph[t] / 5))]++; vals[t].push(ph[t]); }
  }
  const out = { hist, N, stat: {} };
  for (const t of TRAITS) {
    const v = vals[t].sort((a, b) => a - b);
    out.stat[t] = { mean: v.reduce((a, b) => a + b, 0) / N, lo: v[Math.floor(N * .1)], hi: v[Math.floor(N * .9)] };
  }
  const pass = (g, id) => dose(g, id) / 2;
  const pDom = id => 1 - (1 - pass(s.g, id)) * (1 - pass(d.g, id));
  const pC = pDom("C"), pB = pDom("B"), pa = pass(s.g, "P"), pb = pass(d.g, "P");
  out.coat = [
    { name: "黒", p: pC * pB, fill: COAT_FILL.black, ink: "#f5f2ec" },
    { name: "茶", p: pC * (1 - pB), fill: COAT_FILL.brown, ink: "#ffffff" },
    { name: "白", p: 1 - pC, fill: COAT_FILL.white, ink: "#3b3b3b" },
  ];
  out.spots = [{ name: "無地", p: (1 - pa) * (1 - pb) }, { name: "小斑", p: pa * (1 - pb) + pb * (1 - pa) }, { name: "大斑", p: pa * pb }];
  out.sick = 1 - pDom("D");
  out.mega = 1 - pDom("X");
  out.q = pDom("Q");
  out.muscle = pDom("M");
  predCache = { key, val: out };
  return out;
}
function mateWhy() {
  const s = get(G.sel.M), d = get(G.sel.F);
  if (!s || !d) return !s ? "父 ♂ を選んでね" : "母 ♀ を選んでね";
  const rs = restWhy(s), rd = restWhy(d);
  if (rs) return `${s.name}: ${rs}`;
  if (rd) return `${d.name}: ${rd}`;
  if (room() < 1) return "飼育場が満員";
  return "";
}
function mate() {
  if (mateWhy()) return;
  const s = get(G.sel.M), d = get(G.sel.F);
  s.acted = d.acted = G.day;
  s.tries++;
  if (R() > 0.35 + 0.6 * s.ph.fer / 100) {
    d.births.push({ day: G.day, n: 0 });
    note(`${s.name}×${d.name}: 子ができなかった`);
    ui.flash = { cls: "bad", text: "今回は子ができなかった…　2匹とも今日はお休み。子ができるかは父の生殖力しだい", ids: [] };
    return;
  }
  s.hits++;
  const born = Math.max(1, poisson(0.6 + d.ph.fer / 100 * 4.4, R)), n = Math.min(born, room()), ids = [];
  d.births.push({ day: G.day, n: born });
  for (let k = 0; k < n; k++) ids.push(addInd({ g: childGenome(s.g, d.g, R), sex: R() < 0.5 ? "M" : "F", star: 0, sire: s.id, dam: d.id, gen: Math.max(s.gen, d.gen) + 1, born: G.day }).id);
  const lost = born - n;
  note(`${s.name}×${d.name}: ${born}匹うまれた${lost ? ` (${lost}匹は里親へ)` : ""}`);
  ui.flash = { cls: lost ? "bad" : "ok", text: `${born}匹うまれた！${lost ? `　空きがなく${lost}匹は里親へ…` : ""}`, ids };
}

/* ---------- 大会 ---------- */
const TOURS = {
  race: { name: "モフレース", short: "レース", desc: "強さで勝負", trait: "str", offset: 0, tool: "watch" },
  contest: { name: "美モフコンテスト", short: "コンテスト", desc: "魅力で勝負", trait: "cha", offset: 0, tool: "score" },
  show: { name: "品評会", short: "品評会", desc: "3つの能力の平均で勝負", trait: null, offset: -6, tool: "stats" },
};
const TIERS = [
  { name: "初級", s: "初", mean: 40, prize: 80 },
  { name: "中級", s: "中", mean: 55, prize: 180 },
  { name: "上級", s: "上", mean: 68, prize: 400 },
  { name: "王者", s: "王", mean: 80, prize: 1000 },
];
const PLACE_PAY = [1, 0.3, 0.15];
function enterTour(type, id) {
  const ind = get(id), T = TOURS[type], tier = TIERS[G.tiers[type]];
  if (!ind || restWhy(ind) || G.entered[type] === G.day) return;
  ind.acted = G.day; G.entered[type] = G.day;
  const score = T.trait ? measure(ind, T.trait, 6, T.short + "大会", U(T.tool))
    : clamp(Math.round((ind.ph.str + ind.ph.cha + ind.ph.fer) / 3 + gauss(R) * 5), 0, 100);
  const rows = [{ name: ind.name, score, me: true }];
  for (let i = 0; i < 7; i++) rows.push({ name: "野良の" + makeName(R), score: clamp(Math.round(tier.mean + T.offset + gauss(R) * 7), 0, 100), me: false });
  rows.sort((a, b) => b.score - a.score || (a.me ? -1 : b.me ? 1 : 0));
  const place = rows.findIndex(r => r.me) + 1;
  const prize = place <= 3 ? Math.round(tier.prize * PLACE_PAY[place - 1]) : 15;
  G.coins += prize;
  let up = "";
  if (place === 1) {
    ind.wins++;
    if (G.tiers[type] < 3) { G.tiers[type]++; up = `${TIERS[G.tiers[type]].name}に昇格！`; }
    else if (!G.cleared[type]) { G.cleared[type] = true; up = "王者の称号を獲得！"; }
    if (!G.hallDay && Object.values(G.cleared).every(Boolean)) { G.hallDay = G.day; up += " 殿堂入り！！"; }
  }
  G.tourRes[type] = { day: G.day, tier: tier.name, rows, place, prize, shown: U(T.tool), who: ind.id, up };
  note(`${T.name}${tier.name}: ${ind.name} ${place}位 +${prize}${up ? " " + up : ""}`);
}

/* ---------- 1日の終わり ---------- */
const upkeep = () => G.stock.reduce((s, id) => s + (isAdult(get(id)) ? UPKEEP_ADULT : UPKEEP_BABY), 0);
function endDay() {
  const cost = upkeep(), oldBanner = bannerOf(G.day);
  G.coins -= cost;
  G.day++;
  const gotTicket = G.tickets < MAX_TICKETS;
  if (gotTicket) G.tickets++;
  G.tourRes = {}; G.pulls = [];
  const grown = G.stock.map(get).filter(i => G.day - i.born === ADULT_AGE);
  const info = { cost, gotTicket, grown: grown.map(i => i.id), banner: bannerOf(G.day) !== oldBanner ? bannerOf(G.day).name : null };
  note(`${G.day}日目の朝 (餌代 −${cost})`);
  grown.forEach(i => { const sp = specials(i); note(sp.length ? `${i.name}が大人に…${sp.join("、")}！` : `${i.name}が大人になった`); });
  ui.sheet = { kind: "day", info };
}

/* ---------- ガチャ ---------- */
function pullWhy(n, pay) {
  if (room() < n) return room() ? `空きが${room()}匹分しかない` : "飼育場が満員";
  if (pay === "ticket") return G.tickets < 1 ? "明日また1枚" : "";
  const c = n === 5 ? PULL5_COST : PULL_COST;
  return G.coins < c ? `あと${c - G.coins}コイン` : "";
}
function pull(n, pay) {
  if (pullWhy(n, pay)) return;
  if (pay === "ticket") G.tickets--; else G.coins -= n === 5 ? PULL5_COST : PULL_COST;
  const banner = bannerOf(G.day), ids = [];
  for (let i = 0; i < n; i++) {
    const rar = rollRarity(R);
    ids.push(addInd({ g: gachaGenome(rar, banner, R), sex: R() < 0.5 ? "M" : "F", star: rar.star, sire: null, dam: null, gen: 0, born: G.day - 99 }).id);
  }
  G.pulls.push(...ids);
  ids.map(get).forEach(i => note(`ガチャ: ${i.name} ★${i.star}${specials(i).length ? "・" + specials(i)[0] : ""}`));
  ui.sheet = { kind: "gacha", ids };
}

function buy(id) {
  const r = RESEARCH.find(x => x.id === id);
  if (!r || U(id) || !reqOk(r) || G.coins < r.price) return;
  G.coins -= r.price; G.unlocks[id] = G.day;
  note(`研究所: ${r.name}を導入`);
  toast(`${r.name}を導入した！`);
}
function sell(id) {
  const ind = get(id);
  G.stock = G.stock.filter(x => x !== id);
  if (G.sel.M === id) G.sel.M = null;
  if (G.sel.F === id) G.sel.F = null;
  G.coins += SELL_PRICE;
  note(`${ind.name}を売った (+${SELL_PRICE})`);
  toast(`${ind.name}を売った +${SELL_PRICE}`);
  ui.sheet = null;
}

/* ---------- 所長のひとこと ---------- */
function bossLine() {
  const all = G.stock.map(get), adults = all.filter(isAdult), ready = all.filter(canAct);
  const measured = all.some(i => TRAITS.some(t => i.meas[t].length));
  if (G.coins < upkeep() * 2) return "コインが心細い。大会で稼ぐか、何匹か売って餌代を減らそう。";
  if (!measured) return "まずは誰かをタップして「走らせる」。見た目だけじゃ実力はわからんぞ。";
  if (G.sel.M != null && G.sel.F == null) return "父は決まった。次は母 ♀ をタップして「母にする」。";
  if (G.sel.F != null && G.sel.M == null) return "母は決まった。次は父 ♂ をタップして「父にする」。";
  if (adults.length && !ready.length) return "今日はみんなお休み。右上の「次の日へ」で明日にしよう。";
  if (!Object.keys(G.unlocks).length && G.coins >= 250) return "研究所で道具を買うと、能力が数字で見えるようになる。";
  if (G.tickets > 0 && room() > 0) return "ガチャチケットが残ってる。新しい子を迎えてみよう。";
  if (Object.keys(TOURS).some(k => G.entered[k] !== G.day) && ready.length) return "大会はまだ空いてる。実力がわかってきた子を出してみよう。";
  return "動ける子は1日1回。実験・交配・大会のどれに使うかが腕の見せどころだ。";
}

/* ---------- 描画ヘルパ ---------- */
const $ = sel => document.querySelector(sel);
/* SVG の属性値に var() を書くと効かないブラウザがあるので style にまとめ直す */
function svgVars(html) {
  return html.replace(/<[^>]+>/g, tag => {
    const decl = [];
    const t = tag.replace(/\s(fill|stroke|font-family)="(var\([^"]+\))"/g, (_, k, v) => { decl.push(`${k}:${v}`); return ""; });
    return decl.length ? t.replace(/^<([\w:-]+)/, `<$1 style="${decl.join(";")}"`) : tag;
  });
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sexMark = s => (s === "M" ? "♂" : "♀");
const starStr = n => (n ? `<span class="stars" aria-label="レア度${n}">${"★".repeat(n)}</span>` : "");
const ava = (ind, size) => `<span class="ava" style="width:${size}px;height:${size}px">${avatar(ind)}</span>`;
const fmt = n => n.toLocaleString("ja-JP");

function track(ind, t) {
  const i = traitInfo(ind, t), gv = ind.dna >= 2 ? baseValues(ind.g)[t] : null;
  let s = "";
  if (i && i.kind === "est") { const lo = clamp(i.mean - i.ci, 0, 100), hi = clamp(i.mean + i.ci, 0, 100); s += `<span class="band" style="left:${lo}%;width:${hi - lo}%;background:var(--${t})"></span><span class="dot" style="left:${clamp(i.mean, 0, 100)}%;background:var(--${t})"></span>`; }
  else if (i && i.kind === "last") s += `<span class="dot" style="left:${i.v}%;background:var(--${t})"></span>`;
  else if (i) { const [a, b] = BIN5[i.bin]; s += `<span class="band vague" style="left:${a}%;width:${b - a}%;background:var(--${t})"></span>`; }
  if (gv != null) s += `<span class="gen" style="left:${clamp(gv, 0, 100)}%"></span>`;
  return `<span class="trk">${s}</span>`;
}
function badges(ind) {
  const b = [];
  if (G.sel.M === ind.id) b.push(`<span class="chip pa">父</span>`);
  if (G.sel.F === ind.id) b.push(`<span class="chip pa">母</span>`);
  if (!isAdult(ind)) b.push(`<span class="chip">幼体 あと${ADULT_AGE - (G.day - ind.born)}日</span>`);
  else if (ind.acted === G.day) b.push(`<span class="chip zz">zzz 休み</span>`);
  if (isAdult(ind) && isSpecial(ind)) b.push(`<span class="chip gold">特異体質</span>`);
  if (!has(ind.g, "D")) b.push(`<span class="chip red">病気</span>`);
  if (ind.wins) b.push(`<span class="chip gold">優勝${ind.wins}</span>`);
  return b.join("");
}

/* ---------- 飼育場 ---------- */

    ${G.cap < MAX_CAP ? `<button class="btn" data-act="expand"${G.coins < price ? " disabled" : ""}>飼育枠+4<span class="sub" style="margin-left:4px">${price}コイン</span></button>` : ""}</span></div>`;
  h += `<div class="list">${ids.map(id => {
    const ind = get(id), sel = G.sel.M === id || G.sel.F === id;
    return `<button class="box mofu${sel ? " sel" : ""}" data-act="open" data-id="${id}">
      ${ava(ind, 56)}
      <span style="min-width:0"><span class="head"><span class="nm">${esc(ind.name)}</span><span class="sx">${sexMark(ind.sex)}</span>${starStr(ind.star)}${badges(ind)}</span>
      <span class="meters">${TRAITS.map(t => { const i = traitInfo(ind, t); return `<span class="m"><span class="top-l"><span class="ml">${TNAME[t]}</span><span class="mv${i ? "" : " q"}">${infoText(i, t)}</span></span>${track(ind, t)}</span>`; }).join("")}</span></span>

function alleleChips(g, i) {

  const label = i => (T.trait ? infoText(traitInfo(i, T.trait), T.trait) : TRAITS.map(t => infoText(traitInfo(i, t), t)).join(" / "));
  const list = G.stock.map(get).filter(isAdult).sort((a, b) => (canAct(b) - canAct(a)) || rank(b) - rank(a));
  let h = sheetHead(`${T.name} ${tier.name}`) + `<div class="sheet-body"><p class="muted" style="font-weight:700;font-size:13.5px">${T.desc}。相手の平均は${tier.mean + T.offset}点くらい。出場した子は今日はもう休み。</p><div>`;
  h += list.map(i => { const why = restWhy(i); return `<div class="row-pick${why ? " off" : ""}">${ava(i, 48)}<span class="t"><b>${esc(i.name)} ${sexMark(i.sex)} ${starStr(i.star)}</b><span>${T.trait ? TNAME[T.trait] : "強さ / 魅力 / 生殖力"}: ${label(i)}</span>${odds(rank(i), tier.mean + T.offset)}</span><button class="btn ${why ? "" : "go"}" data-act="enter" data-type="${type}" data-id="${i.id}"${why ? " disabled" : ""}>${why ? "休み" : "出す"}</button></div>`; }).join("") || `<p class="lock">大人のモフがいない。</p>`;
  return h + `</div></div>`;
}
function resultSheet(type) {
  const T = TOURS[type], r = G.tourRes[type];
  if (!r) return sheetHead(T.name);
  const who = get(r.who);
  let h = sheetHead(`${T.name} ${r.tier}`) + `<div class="sheet-body"><div class="result-big">${who ? `<div style="display:flex;justify-content:center">${ava(who, 72)}</div>` : ""}<span class="p${r.place === 1 ? " win" : ""}">${r.place === 1 ? "優勝！" : r.place + "位"}</span><b>${who ? esc(who.name) : ""} · +${r.prize}コイン</b>${r.up ? `<span class="chip gold" style="justify-self:center;font-size:14px">${r.up}</span>` : ""}</div>`;
  h += `<table class="gtable"><tbody>${r.rows.map((x, i) => `<tr class="${x.me ? "me" : ""}"><td class="num">${i + 1}</td><td>${esc(x.name)}</td><td class="num" style="text-align:right">${r.shown ? x.score : "—"}</td></tr>`).join("")}</tbody></table>`;
  if (!r.shown) h += `<p class="legend">点数は研究所の「${RESEARCH.find(x => x.id === T.tool).name}」で見られる。</p>`;
  return h + `<button class="btn go wide" data-act="close">OK</button></div>`;
}
function daySheet(info) {
  let h = `<div class="sheet-head"><span class="grab"></span><h2 style="text-align:center">朝</h2><button class="iconbtn" data-act="close" aria-label="閉じる">×</button></div><div class="sheet-body"><div class="day-title">${G.day}日目</div><div class="day-list">`;
  h += `<div class="li">${ICON.coin}<span>餌代 −${info.cost}コイン → 残り <b class="num" style="color:${G.coins < 0 ? "var(--danger)" : "inherit"}">${fmt(G.coins)}</b></span></div>`;
  if (info.gotTicket) h += `<div class="li">${ICON.ticket}<span>ガチャチケット +1</span></div>`;
  for (const id of info.grown) { const i = get(id); if (!i) continue; const sp = specials(i); h += `<div class="li">${ava(i, 40)}<span><b>${esc(i.name)}</b>が大人になった${sp.length ? `……<b style="color:var(--rare)">${esc(sp.join("、"))}！</b>` : ""}</span></div>`; }
  if (info.banner) h += `<div class="li">${ICON.gacha.replace('<svg', '<svg class="ico" style="width:22px;height:22px;color:var(--brand)"')}<span>ガチャが「${info.banner}」に</span></div>`;
  if (G.coins < 0) h += `<p class="flash bad">コインがマイナス。大会で稼ぐか、売って餌代を減らそう。</p>`;
  return h + `</div><button class="btn go wide" data-act="close" style="min-height:52px;font-size:17px">今日もがんばる</button></div>`;
}
function gachaSheet(ids) {
  const sp = ids.map(get).filter(i => specials(i).length);
  let h = sheetHead("ガチャ結果") + `<div class="sheet-body">`;
  if (sp.length) h += `<p class="flash">特異体質！ ${esc(sp.map(i => `${i.name}: ${specials(i)[0]}`).join(" / "))}</p>`;
  h += `<div class="caps">${ids.map(id => capHTML(get(id))).join("")}</div><p class="legend">タップすると詳しく見られる。</p>`;
  return h + `<button class="btn go wide" data-act="close">OK</button></div>`;
}
function renderSheet() {
  const root = $("#sheet-root"), el = $("#sheet"), s = ui.sheet;
  root.hidden = !s;
  document.body.classList.toggle("locked", !!s);
  if (!s) { el.innerHTML = ""; return; }
  const top = el.dataset.key === sheetKey(s) ? el.scrollTop : 0;
  el.innerHTML = s.kind === "mofu" ? mofuSheet(s.id) : s.kind === "mate" ? mateSheet() : s.kind === "entry" ? entrySheet(s.type)
    : s.kind === "result" ? resultSheet(s.type) : s.kind === "day" ? daySheet(s.info) : gachaSheet(s.ids);
  el.classList.toggle("tall", s.kind === "mofu");
  el.scrollTop = top;
  if (el.dataset.key !== sheetKey(s)) { el.dataset.key = sheetKey(s); el.focus({ preventScroll: true }); }
}
const sheetKey = s => s.kind + ":" + (s.id ?? s.type ?? "");

/* ---------- 全体 ---------- */
function render() {
  renderTop(); renderNav();
  const v = { farm: renderFarm, tour: renderTour, gacha: renderGacha, lab: renderLab }[ui.tab]();
  $("#main").innerHTML = `<div class="view">${v}</div>`;
  renderPairBar(); renderSheet();
  save();
}
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2200); }
function arm(key) { ui.confirm = key; clearTimeout(ui.confirmT); ui.confirmT = setTimeout(() => { if (ui.confirm === key) { ui.confirm = null; render(); } }, 4000); }

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const act = el.dataset.act, id = el.dataset.id != null && act !== "buy" ? +el.dataset.id : null;
  const keep = ui.confirm;
  ui.confirm = null;
  switch (act) {
    case "tab": ui.tab = el.dataset.tab; ui.sheet = null; window.scrollTo(0, 0); try { localStorage.setItem(STORE_KEY + "-tab", ui.tab); } catch (err) {} break;
    case "open": ui.flash = null; ui.sheet = { kind: "mofu", id }; break;
    case "close": ui.sheet = null; ui.flash = null; break;
    case "exp": doExp(id, el.dataset.kind); break;
    case "gtest": geneTest(id, +el.dataset.lv); break;
    case "pair": { const ind = get(id); G.sel[ind.sex] = G.sel[ind.sex] === id ? null : id; ui.flash = null;
      if (G.sel.M != null && G.sel.F != null) { ui.sheet = { kind: "mate" }; }
      else toast(G.sel[ind.sex] === id ? `${ind.name}を${ind.sex === "M" ? "父" : "母"}にした。次は${ind.sex === "M" ? "母 ♀" : "父 ♂"}を選ぼう` : "親から外した");
      break; }
    case "unpair": G.sel[el.dataset.sex] = null; ui.flash = null; break;
    case "open-mate": ui.flash = null; ui.sheet = { kind: "mate" }; break;
    case "mate": if (room() < 4 && keep !== "mate") { arm("mate"); break; } mate(); break;
    case "sell": if (keep !== "sell:" + id) { arm("sell:" + id); break; } sell(id); break;
    case "buy": if (keep !== "buy:" + el.dataset.id) { arm("buy:" + el.dataset.id); break; } buy(el.dataset.id); break;
    case "reset": if (keep !== "reset") { arm("reset"); break; } newGame(Date.now() >>> 0); ui.tab = "farm"; ui.sheet = null; toast("新しい牧場をはじめた"); break;
    case "endday": endDay(); break;
    case "entry": ui.sheet = { kind: "entry", type: el.dataset.type }; break;
    case "enter": enterTour(el.dataset.type, id); ui.sheet = { kind: "result", type: el.dataset.type }; break;
    case "result": ui.sheet = { kind: "result", type: el.dataset.type }; break;
    case "pull": pull(+el.dataset.n, el.dataset.pay); break;
    case "expand": { const p = expandPrice(); if (G.cap >= MAX_CAP || G.coins < p) break; G.coins -= p; G.cap = Math.min(MAX_CAP, G.cap + 4); note(`飼育場を${G.cap}匹分に (−${p})`); toast(`飼育場が${G.cap}匹分に広がった`); break; }
    default: return;
  }
  render();
});
document.addEventListener("change", e => { if (e.target.id === "sort") { G.sort = e.target.value; render(); } });
document.addEventListener("keydown", e => {
  if (!ui.sheet) return;
  if (e.key === "Escape") { ui.sheet = null; ui.flash = null; render(); }
});

/* ---------- 起動 ---------- */
function start(data) {
  let ok = data && data.game ? restore(data.game) : false;
  if (!ok) { try { ok = restore(JSON.parse(localStorage.getItem(STORE_KEY))); } catch (e) { ok = false; } }
  if (!ok) newGame(20261006);
  try { const t = localStorage.getItem(STORE_KEY + "-tab"); if (["farm", "tour", "gacha", "lab"].includes(t)) ui.tab = t; } catch (e) {}
  render();
}
window.claude?.hot?.snapshot?.(() => ({ game: { ...G, reg: [...G.reg.values()] } }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
